/* =========================================================================
   Reusable Question Session — powers drills, mistakes, checkpoints, path
   practice, extreme, and quizzes. Renders into a container; calls onDone.
   ========================================================================= */
function runQuestionSession(cfg) {
  const box = cfg.container;
  const qs = cfg.questions.slice();
  const S0 = {
    idx: 0, results: [], chosen: null, submitted: false, struck: new Set(),
    hearts: (typeof cfg.hearts === 'number') ? cfg.hearts : (cfg.hearts ? 5 : null), startTs: 0, done: false,
  };
  function cur() { return qs[S0.idx]; }

  function render() {
    if (S0.idx >= qs.length || (S0.hearts !== null && S0.hearts <= 0)) return finish();
    const q = cur();
    S0.chosen = null; S0.submitted = false; S0.struck = new Set(); S0.startTs = Date.now();
    const prog = `${S0.idx + 1} / ${qs.length}`;
    const heartsHtml = S0.hearts !== null ? `<span class="hearts">${Array.from({ length: 5 }, (_, i) => `<span class="h ${i < S0.hearts ? '' : 'lost'}">♥</span>`).join('')}</span>` : '';
    const comboHtml = (!cfg.meta?.silent && S.combo > 1) ? `<span class="pill gold">🔥 ${S.combo} combo</span>` : '';
    box.innerHTML = `
      <div class="player">
        <div class="row spread" style="margin-bottom:14px">
          <div class="row" style="gap:10px">
            <span class="pill">${esc(cfg.title || 'Practice')}</span>
            ${skillPill(q.skill)} ${diffDots(q.difficulty)}
          </div>
          <div class="row" style="gap:10px">${comboHtml}${heartsHtml}<span class="mono muted">${prog}</span></div>
        </div>
        <div class="bar" style="margin-bottom:18px"><span style="width:${(S0.idx) / qs.length * 100}%"></span></div>
        <div class="card pad-lg">${renderQuestionBody(q)}</div>
        <div class="row spread" style="margin-top:16px">
          <div id="qHintSlot"></div>
          <div class="row" style="gap:10px">
            <button class="btn ghost" id="qSkip">Skip</button>
            <button class="btn primary" id="qSubmit" disabled>Submit</button>
          </div>
        </div>
        <div id="qExplain"></div>
      </div>`;
    typeset(box);
    wire(q);
  }

  function renderQuestionBody(q) {
    const passage = q.passage ? `<div class="passage">${mathToHtml(q.passage)}</div>` : '';
    const stem = `<div class="stem">${mathToHtml(q.stem)}</div>`;
    let input;
    if (q.type === 'spr') {
      input = `<div><input type="text" class="spr-input" id="sprIn" placeholder="Type your answer" autocomplete="off" inputmode="text">
        <div class="tag" style="margin-top:6px">Student-produced response — fractions or decimals accepted.</div></div>`;
    } else {
      input = `<div class="choices" id="choices">${q.choices.map((c, i) => `
        <div class="choice" data-i="${i}" data-letter="${LETTERS[i]}">
          <span class="key">${LETTERS[i]}</span>
          <span class="txt">${mathToHtml(c)}</span>
          <button class="elim" title="Cross out (X)" tabindex="-1">✕</button>
        </div>`).join('')}</div>`;
    }
    return passage + stem + input;
  }

  function wire(q) {
    const submitBtn = $('#qSubmit', box);
    if (q.type === 'spr') {
      const inp = $('#sprIn', box);
      inp.addEventListener('input', () => { S0.chosen = inp.value; submitBtn.disabled = inp.value.trim() === ''; });
      inp.focus();
    } else {
      $$('#choices .choice', box).forEach((el) => {
        el.addEventListener('click', () => selectChoice(el));   // whole row is clickable
        el.querySelector('.elim').addEventListener('click', (e) => { e.stopPropagation(); toggleStrike(el); });
      });
    }
    submitBtn.addEventListener('click', () => S0.submitted ? next() : submit(q));
    $('#qSkip', box).addEventListener('click', () => { if (!S0.submitted) { S0.idx++; render(); } });
  }
  function selectChoice(el) {
    if (S0.submitted) return;
    $$('#choices .choice', box).forEach((c) => c.classList.remove('sel'));
    el.classList.add('sel'); el.classList.remove('struck'); S0.struck.delete(el.dataset.letter);
    S0.chosen = el.dataset.letter;
    $('#qSubmit', box).disabled = false;
  }
  function toggleStrike(el) {
    if (S0.submitted) return;
    const L = el.dataset.letter;
    if (S0.struck.has(L)) { S0.struck.delete(L); el.classList.remove('struck'); }
    else { S0.struck.add(L); el.classList.add('struck'); if (el.classList.contains('sel')) { el.classList.remove('sel'); S0.chosen = null; $('#qSubmit', box).disabled = true; } }
  }

  function submit(q) {
    if (S0.chosen == null || (typeof S0.chosen === 'string' && S0.chosen.trim() === '')) return;
    S0.submitted = true;
    const sec = (Date.now() - S0.startTs) / 1000;
    const res = recordAnswer(q, S0.chosen, Object.assign({ sec }, cfg.meta || {}));
    S0.results.push({ q, correct: res.correct, chosen: S0.chosen, sec });
    if (S0.hearts !== null && !res.correct) { S0.hearts--; if (cfg.onMiss) cfg.onMiss(S0.hearts); }
    showFeedback(q, res);
    updateComboFlash(res);
  }

  function showFeedback(q, res) {
    // annotate choices
    if (q.type === 'mcq') {
      $$('#choices .choice', box).forEach((el) => {
        const L = el.dataset.letter;
        if (L === q.answer) el.classList.add('correct');
        else if (L === S0.chosen) el.classList.add('wrong');
        el.querySelector('.txt').style.pointerEvents = 'none';
        el.querySelector('.key').style.pointerEvents = 'none';
      });
    } else {
      const inp = $('#sprIn', box); inp.disabled = true;
      inp.style.borderColor = res.correct ? 'var(--mint)' : 'var(--coral)';
    }
    const correctText = q.type === 'spr' ? `Correct answer: <b>${esc([].concat(q.answer)[0])}</b>` :
      `Correct answer: <b>${q.answer}</b> — ${mathToHtml(q.choices[LETTERS.indexOf(q.answer)])}`;
    const dm = res.mastery;
    const masteryLine = dm ? `<div class="tag" style="margin-top:8px">Mastery of ${esc(SKILL_BY_ID[q.skill].name)}: ${Math.round(dm.from)} → <b style="color:${res.correct ? 'var(--mint)' : 'var(--coral)'}">${Math.round(dm.to)}</b></div>` : '';
    const tutor = tutorButtons(q, S0.chosen, res.correct);
    $('#qExplain', box).innerHTML = `
      <div class="explain ${res.correct ? 'correct' : 'wrong'}">
        <div class="row spread"><h4 style="margin:0">${res.correct ? '✓ Correct' : '✗ Not quite'}</h4>
          ${!cfg.meta?.silent && res.correct ? `<span class="pill gold">+${res.xpGain} XP</span>` : ''}</div>
        ${res.correct ? '' : `<p style="margin:.5em 0">${correctText}</p>`}
        <div>${mathToHtml(q.explanation)}</div>
        ${masteryLine}
        ${tutor}
      </div>`;
    typeset($('#qExplain', box));
    wireTutor(q);
    const sb = $('#qSubmit', box);
    sb.textContent = S0.idx + 1 >= qs.length ? 'Finish' : 'Next';
    sb.disabled = false;
    $('#qSkip', box).style.display = 'none';
    sb.focus();
  }
  function next() { S0.idx++; render(); }

  function updateComboFlash(res) {
    if (!cfg.meta?.silent && res.correct && S.combo >= 3 && S.combo % 3 === 0) {
      const c = document.createElement('div'); c.className = 'combo'; c.textContent = `${S.combo}× COMBO`;
      document.body.appendChild(c); setTimeout(() => c.remove(), 800);
    }
  }

  function finish() {
    S0.done = true; teardownKeys();
    const total = S0.results.length;
    const correct = S0.results.filter((r) => r.correct).length;
    const acc = total ? Math.round(correct / total * 100) : 0;
    const xp = S0.results.filter((r) => r.correct).reduce((a, r) => a + (XP_BASE[r.q.difficulty] || 10), 0);
    const summary = { total, correct, acc, results: S0.results, heartsOut: S0.hearts === 0 };
    if (cfg.mode === 'drill' && total > 0) award('first_drill');
    if (cfg.onDone) { cfg.onDone(summary); return; }
    box.innerHTML = defaultSummary(summary, cfg);
    typeset(box);
    $$('[data-again]', box).forEach((b) => b.onclick = () => cfg.restart && cfg.restart());
    $$('[data-review]', box).forEach((b) => b.onclick = () => reviewSession(summary, cfg));
  }

  // keyboard shortcuts
  function onKey(e) {
    if (S0.done) return;
    const ae = document.activeElement;
    // Don't hijack keys while typing in the assistant / command bar / other inputs.
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id !== 'sprIn') return;
    const q = cur(); if (!q) return;
    if (e.key === 'Enter') { e.preventDefault(); const sb = $('#qSubmit', box); if (sb && !sb.disabled) sb.click(); return; }
    if (S0.submitted) return;
    if (q.type === 'mcq') {
      const k = e.key.toUpperCase();
      const i = LETTERS.indexOf(k);
      if (i >= 0 && i < q.choices.length) { const el = $$('#choices .choice', box)[i]; if (e.shiftKey) toggleStrike(el); else selectChoice(el); }
    }
  }
  function teardownKeys() { document.removeEventListener('keydown', onKey); }
  document.addEventListener('keydown', onKey);

  render();
  return { finishNow: finish };
}

function reviewSession(summary, cfg) {
  const host = openModal(`<h3>Review</h3><div class="stack" id="revList" style="max-height:64vh;overflow:auto"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>Close</button></div>`);
  const list = $('#revList', host.el);
  list.innerHTML = summary.results.map((r) => `
    <div class="card" style="border-left:3px solid ${r.correct ? 'var(--mint)' : 'var(--coral)'}">
      ${r.q.passage ? `<div class="muted" style="font-size:.85rem;margin-bottom:6px">${mathToHtml(r.q.passage)}</div>` : ''}
      <div style="font-weight:600;margin-bottom:6px">${mathToHtml(r.q.stem)}</div>
      <div class="tag">Your answer: ${esc(String(r.chosen))} · ${r.correct ? 'correct' : 'answer: ' + esc(String([].concat(r.q.answer)[0]))}</div>
      <div style="margin-top:8px;font-size:.9rem">${mathToHtml(r.q.explanation)}</div>
    </div>`).join('');

}

      else if (params.section) opts = { section: params.section, limit: 10 };

// Central drill starter (also used by Sable tool-use). opts: {skill,section,domain,difficulty,limit,mixed,extreme}
// Stashes config and routes to the drills view, which runs it in mount().
function startDrill(opts = {}) {
  PENDING_DRILL = opts;
  navigate('drills', { run: 1 });
}
function runDrill(opts, root) {
  const limit = opts.limit || 10;
  const pool = pickQuestions({
    skill: opts.skill, section: opts.section, domain: opts.domain,
    difficulty: opts.difficulty ? Number(opts.difficulty) : undefined,
    extreme: opts.extreme, limit, sortByDifficulty: !opts.mixed,
  });
  const host = (root && root.querySelector('#drillRun')) || document.getElementById('drillRun') || document.getElementById('view');
  if (!pool.length) { host.innerHTML = `<div class="card">No questions match that filter yet. <button class="btn sm" onclick="navigate('drills')">Back</button></div>`; return; }
  const label = opts.extreme ? 'Extreme' : opts.skill ? SKILL_BY_ID[opts.skill].name : opts.section ? SECTIONS[opts.section].name + ' mixed' : 'Mixed drill';
  runQuestionSession({
    container: host, questions: pool, mode: opts.extreme ? 'extreme' : 'drill', title: label,
    restart: () => startDrill(opts),
  });
}

/* =========================================================================
   Skill Path — a curated winding sequence of bite-sized nodes.
   ========================================================================= */
const PATH_ORDER = [
  'alg_linear_eq', 'rw_boundaries', 'alg_linear_fn', 'rw_vocab', 'alg_systems',
  'rw_sva', 'alg_inequal', 'rw_transitions', 'alg_word', 'rw_main',
  'adv_quadratic', 'rw_verb', 'adv_exponents', 'rw_purpose', 'adv_exponential',
  'rw_evidence', 'adv_polynomial', 'rw_modifiers', 'adv_rational', 'rw_inference',
  'adv_functions', 'rw_synthesis', 'psda_ratio', 'rw_quant', 'psda_percent',
  'rw_connections', 'psda_data', 'psda_stats', 'psda_prob', 'geo_angles',
  'geo_trig', 'geo_circles', 'geo_volume',
];
let PATH = [];
function buildPath() {
  PATH = [];
  let recent = [];
  PATH_ORDER.forEach((skill, i) => {
    PATH.push({ id: `p${PATH.length}`, kind: 'micro', skill });
    PATH.push({ id: `p${PATH.length}`, kind: 'practice', skill });
    recent.push(skill);
    if ((i + 1) % 3 === 0 || i === PATH_ORDER.length - 1) {
      PATH.push({ id: `p${PATH.length}`, kind: 'checkpoint', skills: recent.slice() });
      recent = [];
    }
  });
}
function nodeDone(n) { return !!S.path[n.id]; }
function firstUndoneIndex() { for (let i = 0; i < PATH.length; i++) if (!nodeDone(PATH[i])) return i; return PATH.length; }
function nodeUnlocked(i) { return i <= firstUndoneIndex(); }
function markNodeDone(n) { if (!S.path[n.id]) { S.path[n.id] = Date.now(); bumpToday('nodes'); if (n.kind === 'micro') markLessonDone(n.skill); save(); } }

const NODE_ICON = { micro: '📘', practice: '✏️', checkpoint: '🏁' };
function nodeLabel(n) {
  if (n.kind === 'checkpoint') return 'Checkpoint';
  return SKILL_BY_ID[n.skill].name;
}

registerView('path', {
  render() {
    const cur = firstUndoneIndex();
    const heartsBar = S.settings.heartsMode ? `<span class="hearts" title="Hearts">${Array.from({ length: S.hearts.max }, (_, i) => `<span class="h ${i < S.hearts.count ? '' : 'lost'}">♥</span>`).join('')}</span>` : '';
    // group nodes into "chapters" by checkpoint boundaries for headers
    let html = '', chapter = 1, sinceHeader = true;
    PATH.forEach((n, i) => {
      if (sinceHeader) { html += `<div class="path-unit-h"><span class="dot"></span><span class="eyebrow">Chapter ${chapter}</span></div>`; sinceHeader = false; }
      const done = nodeDone(n), unlocked = nodeUnlocked(i), isCur = i === cur;
      const off = Math.sin(i * 0.9) * 90; // zigzag
      const cls = done ? 'done' : isCur ? 'current' : unlocked ? '' : 'locked';
      html += `<div class="path-nodes" style="display:flex;justify-content:center">
        <div class="node ${cls}" style="transform:translateX(${off}px)" data-i="${i}" title="${esc(nodeLabel(n))}">
          <span class="ic">${done ? '✓' : NODE_ICON[n.kind]}</span>
          <span class="cap">${esc(nodeLabel(n))}${n.kind === 'checkpoint' ? '' : ' · ' + (n.kind === 'micro' ? 'lesson' : 'practice')}</span>
        </div></div>`;
      if (n.kind === 'checkpoint') { chapter++; sinceHeader = true; }
    });
    const doneCount = PATH.filter(nodeDone).length;
    return `${pageHeader('Skill Path', `${doneCount} / ${PATH.length} nodes complete · bite-sized, ~5 minutes each`,
      `${heartsBar}<button class="btn sm" onclick="navigate('learn')">Browse units</button>`)}
      ${S.settings.heartsMode && S.hearts.count === 0 ? `<div class="card" style="border-color:var(--coral);margin-bottom:12px"><b style="color:var(--coral)">Out of hearts.</b> Clear questions in your <a onclick="navigate('mistakes')" style="cursor:pointer">mistake bank</a> to earn them back.</div>` : ''}
      <div class="path-wrap">${html}</div>`;
  },
  mount(root) {
    $$('.node', root).forEach((el) => el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i);
      if (!nodeUnlocked(i)) { toast('Finish the earlier nodes first.', 'sky'); return; }
      startPathNode(i);
    }));
  },
});

function startPathNode(i) {
  const n = PATH[i];
  const heartsOn = S.settings.heartsMode;
  if (heartsOn && S.hearts.count === 0) { toast('Out of hearts — clear mistake reviews first.', 'coral'); navigate('mistakes'); return; }

  if (n.kind === 'micro') {
    // show the lesson, then a 3-question quick check
    const host = document.getElementById('view');
    const L = LESSON_BY_SKILL[n.skill];
    host.innerHTML = `<div class="player">
      ${pageHeader(SKILL_BY_ID[n.skill].name, 'Micro-lesson · ~5 min', `<button class="btn ghost sm" onclick="navigate('path')">← Path</button>`)}
      <div class="card pad-lg">${L ? L.concept.map((p) => `<p style="font-size:1.04rem;line-height:1.65">${mathToHtml(p)}</p>`).join('') : '<p class="muted">Quick practice for this skill.</p>'}
        ${L && L.traps ? `<div style="margin-top:10px;border-left:3px solid var(--coral);padding-left:12px"><div class="eyebrow" style="color:var(--coral)">Watch out</div><div>${mathToHtml(L.traps[0])}</div></div>` : ''}</div>
      <div class="tac" style="margin-top:14px"><button class="btn primary lg" id="microGo">Got it — quick check →</button></div>`;
    typeset(host);
    $('#microGo', host).onclick = () => runNodeSession(i, pickQuestions({ skill: n.skill, limit: 3, difficultyMax: 2 }));
    return;
  }
  if (n.kind === 'practice') { runNodeSession(i, pickQuestions({ skill: n.skill, limit: 8 })); return; }
  if (n.kind === 'checkpoint') {
    const qs = shuffle([].concat(...n.skills.map((sk) => pickQuestions({ skill: sk, limit: 4 })))).slice(0, 10);
    runNodeSession(i, qs);
  }
}

function runNodeSession(i, qs) {
  const n = PATH[i];
  if (!qs.length) { toast('No questions available for this node yet — marking complete.', 'sky'); markNodeDone(n); navigate('path'); return; }
  const heartsOn = S.settings.heartsMode;
  const host = document.getElementById('view');
  host.innerHTML = `<div id="pnode"></div>`;
  runQuestionSession({
    container: document.getElementById('pnode'), questions: qs, mode: 'path',
    title: nodeLabel(n) + (n.kind === 'checkpoint' ? ' · Checkpoint' : ''),
    hearts: heartsOn ? S.hearts.count : null,
    onMiss: heartsOn ? () => { S.hearts.count = Math.max(0, S.hearts.count - 1); save(); } : null,
    onDone: (sm) => {
      const passed = !sm.heartsOut;
      if (passed) { markNodeDone(n); touchStreak(); }
      host.innerHTML = `<div class="player"><div class="card pad-lg tac">
        <div style="font-size:2.6rem">${passed ? '🎉' : '💔'}</div>
        <h2 style="margin:.2em 0">${passed ? 'Node complete!' : 'Out of hearts'}</h2>
        <div class="muted">${sm.correct}/${sm.total} correct${passed ? '' : ' — refill hearts by clearing mistake reviews'}</div>
        <div class="row" style="justify-content:center;gap:10px;margin-top:16px">
          <button class="btn" data-review>Review answers</button>
          ${passed ? `<button class="btn primary" onclick="navigate('path')">Continue path →</button>` : `<button class="btn" onclick="navigate('mistakes')">Mistake bank</button><button class="btn primary" onclick="startPathNode(${i})">Retry</button>`}
        </div></div></div>`;
      typeset(host);
      $$('[data-review]', host).forEach((b) => b.onclick = () => reviewSession(sm, {}));
    },
  });
}

/* =========================================================================
   UI + engine — Vocabulary (Quizlet-style).
   Import (CSV/JSON, multiple named sets), simplified SM-2 spaced repetition,
   daily queue (~40 new + due reviews), mastery tiers, and four game modes:
   flashcards, Learn (adaptive), Match (timed), cloze — plus a quiz generator.
   ========================================================================= */

/* ---------- vocab engine ---------- */
const VOCAB_NEW_PER_DAY = 40;
function cardKey(setId, w) { return setId + '::' + w.toLowerCase(); }
function vocabSeedStarterIfEmpty() {
  if (Object.keys(S.vocab.sets).length) return;
  if (!(typeof VOCAB_STARTER !== 'undefined' && VOCAB_STARTER.length)) return;
  const id = 'starter';
  S.vocab.sets[id] = { id, name: 'Starter SAT Words', createdAt: Date.now(), words: VOCAB_STARTER.map((x) => ({ w: x.w, def: x.def, ex: x.ex || '' })) };
  S.vocab.activeSet = id;
  save();
}
function vocabSets() { return Object.values(S.vocab.sets); }
function activeSet() { const a = S.vocab.activeSet; return S.vocab.sets[a] || vocabSets()[0] || null; }
function setCards(set) { return set ? set.words.map((x) => ({ key: cardKey(set.id, x.w), w: x.w, def: x.def, ex: x.ex, set: set.id })) : []; }
function getSrs(key) {
  let s = S.vocab.srs[key];
  if (!s) { s = S.vocab.srs[key] = { ef: 2.5, interval: 0, due: 0, reps: 0, lapses: 0, new: true }; }
  return s;
}
function vocabTier(s) {
  if (!s || (s.new && s.reps === 0)) return 'New';
  if (s.interval >= 21) return 'Mastered';
  if (s.interval >= 7) return 'Known';
  return 'Learning';
}
// Simplified SM-2. quality: 5 easy, 4 good, 3 hard, <3 fail.
function vocabGrade(key, quality) {
  const s = getSrs(key); s.new = false;
  if (quality < 3) { s.reps = 0; s.interval = 1; s.lapses++; }
  else {
    s.reps++;
    if (s.reps === 1) s.interval = 1;
    else if (s.reps === 2) s.interval = 6;
    else s.interval = Math.round(s.interval * s.ef);
    s.ef = Math.max(1.3, s.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  }
  s.due = Date.now() + s.interval * DAY;
  bumpToday('vocab'); markPlanTaskDone('vocab');
  recomputeWordsMastered();
  save();
  return s;
}
function recomputeWordsMastered() {
  let n = 0;
  for (const set of vocabSets()) for (const c of setCards(set)) if (vocabTier(S.vocab.srs[c.key]) === 'Mastered') n++;
  S.counters.wordsMastered = n;
  if (n >= 100) award('vocab100');
}
function ensureVocabDaily() {
  const d = dayKey();
  if (S.vocab.dailyKey !== d) { S.vocab.dailyKey = d; S.vocab.newToday = 0; }
}
function vocabQueue(set) {
  ensureVocabDaily();
  const now = Date.now();
  const cards = setCards(set);
  const due = cards.filter((c) => { const s = S.vocab.srs[c.key]; return s && !s.new && s.due <= now; });
  const fresh = cards.filter((c) => { const s = S.vocab.srs[c.key]; return !s || s.new; });
  const newAllowed = Math.max(0, VOCAB_NEW_PER_DAY - (S.vocab.newToday || 0));
  return { due, fresh: fresh.slice(0, newAllowed), freshTotal: fresh.length };
}
function vocabTierCounts(set) {
  const c = { New: 0, Learning: 0, Known: 0, Mastered: 0 };
  for (const card of setCards(set)) c[vocabTier(S.vocab.srs[card.key])]++;
  return c;
}

/* ---------- import ---------- */
function parseVocabCSV(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    if (/^word\s*,\s*definition/i.test(line)) continue; // header
    const parts = line.split(',');
    if (parts.length < 2) continue;
    const w = parts[0].trim().replace(/^"|"$/g, '');
    const def = parts[1].trim().replace(/^"|"$/g, '');
    const ex = parts.slice(2).join(',').trim().replace(/^"|"$/g, '');
    if (w && def) out.push({ w, def, ex });
  }
  return out;
}
function importVocabSet(name, words) {
  const id = 'set_' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 20) || uid('s'));
  S.vocab.sets[id] = { id, name: name || 'Imported set', createdAt: Date.now(), words };
  S.vocab.activeSet = id;
  save(); recomputeWordsMastered();
  return id;
}

function renderVocabEmpty() {
  return `${pageHeader('Vocabulary', 'Import your word list to begin — CSV or JSON.')}

      <div style="font-size:2.4rem">📚</div><h3>No vocabulary sets yet</h3>
      <p class="muted">Import your 1,500-word list (or any set) as CSV <span class="mono">word,definition,example</span> or JSON.</p>
      <button class="btn primary" onclick="navigate('vocabimport')">Import a set →</button>
    </div>`;
}

/* ---------- session dispatch ---------- */
function startVocabSession() {
  const set = activeSet(); if (!set) return navigate('vocabimport');
  const q = vocabQueue(set);
  const cards = shuffle(q.due.concat(q.fresh));
  q.fresh.forEach(() => { S.vocab.newToday = (S.vocab.newToday || 0) + 1; });
  save();
  if (!cards.length) { toast('Nothing due — try a practice mode.', 'sky'); return; }
  runFlashcards(cards, true);
}
function runVocabMode(mode) {
  const set = activeSet(); if (!set) return navigate('vocabimport');
  const cards = setCards(set);
  if (cards.length < 4) { toast('Add at least 4 words to this set first.', 'coral'); return; }
  if (mode === 'flash') runFlashcards(shuffle(cards).slice(0, 20), false);
  else if (mode === 'learn') runLearn(shuffle(cards).slice(0, 12));
  else if (mode === 'match') runMatch(set);
  else if (mode === 'cloze') runCloze(shuffle(cards).slice(0, 12));
  else if (mode === 'quiz') runVocabQuiz(shuffle(cards).slice(0, 20));
}

/* ---------- Flashcards (self-graded, updates SRS) ---------- */
function runFlashcards(cards, isSrs) {
  const host = document.getElementById('view');
  let i = 0, flipped = false;
  function render() {
    if (i >= cards.length) return done();
    const c = cards[i];
    host.innerHTML = `<div class="player">
      ${pageHeader('Flashcards', `${i + 1} / ${cards.length}${isSrs ? ' · daily queue' : ''}`, `<button class="btn ghost sm" onclick="navigate('vocab')">✕ End</button>`)}
      <div class="card pad-lg tac" id="fcard" style="cursor:pointer;min-height:220px;display:flex;flex-direction:column;justify-content:center">
        <div class="eyebrow">${flipped ? 'Definition' : 'Word'}</div>
        <div style="font-family:var(--font-display);font-size:${flipped ? '1.5rem' : '2.4rem'};margin:10px 0">${flipped ? esc(c.def) : esc(c.w)}</div>
        ${flipped && c.ex ? `<div class="muted" style="font-style:italic">“${esc(c.ex)}”</div>` : ''}
        <div class="tag" style="margin-top:14px">${flipped ? '' : 'Click or press Space to flip'}</div>
      </div>
      ${flipped ? `<div class="row" style="justify-content:center;gap:10px;margin-top:16px">
        <button class="btn" style="border-color:var(--coral)" data-g="2">Again</button>
        <button class="btn" data-g="4">Good</button>
        <button class="btn" style="border-color:var(--mint)" data-g="5">Easy</button></div>
        <div class="tag tac" style="margin-top:8px">1 = Again · 2 = Good · 3 = Easy</div>` : ''}
    </div>`;
    const card = $('#fcard', host);
    card.onclick = () => { if (!flipped) { flipped = true; render(); } };
    $$('[data-g]', host).forEach((b) => b.onclick = () => { vocabGrade(c.key, parseInt(b.dataset.g)); i++; flipped = false; render(); });
  }
  function done() {
    host.innerHTML = `<div class="player"><div class="card pad-lg tac"><div style="font-size:2.4rem">🎉</div><h2>Session complete</h2>
      <p class="muted">${cards.length} cards reviewed.</p><button class="btn primary" onclick="navigate('vocab')">Back to vocabulary</button></div></div>`;
    touchStreak();
  }
  function key(e) {
    if (e.key === ' ') { e.preventDefault(); if (!flipped) { flipped = true; render(); } }
    else if (flipped && ['1', '2', '3'].includes(e.key)) { const g = { '1': 2, '2': 4, '3': 5 }[e.key]; vocabGrade(cards[i].key, g); i++; flipped = false; render(); }
  }
  document.addEventListener('keydown', key);
  const obs = new MutationObserver(() => { if (!document.getElementById('fcard') && !document.querySelector('.player')) { document.removeEventListener('keydown', key); obs.disconnect(); } });
  render();
}

/* ---------- Learn (adaptive: MC + typed, repeat until mastered) ---------- */
function runLearn(cards) {
  const host = document.getElementById('view');
  const all = setCards(activeSet());
  const queue = cards.map((c) => ({ c, correct: 0 }));
  let done = 0; const need = 2;
  function next() {
    const pending = queue.filter((q) => q.correct < need);
    if (!pending.length) return finish();
    const item = pending[Math.floor(Math.random() * Math.min(3, pending.length))];
    const typed = item.correct >= 1; // escalate to typed after one MC correct
    render(item, typed);
  }
  function render(item, typed) {
    const c = item.c;
    const learned = queue.filter((q) => q.correct >= need).length;
    let body;
    if (typed) {
      body = `<div class="stem">Type the word that means:</div><div class="card" style="background:var(--midnight);margin-bottom:14px">${esc(c.def)}</div>
        <input type="text" id="lin" placeholder="the word…" autocomplete="off"><div class="tag" style="margin-top:6px">Enter to check</div>`;
    } else {
      const opts = shuffle([c].concat(shuffle(all.filter((x) => x.key !== c.key)).slice(0, 3)));
      body = `<div class="stem">Which word means: <b>${esc(c.def)}</b>?</div>
        <div class="choices">${opts.map((o) => `<div class="choice" data-w="${esc(o.w)}"><span class="txt">${esc(o.w)}</span></div>`).join('')}</div>`;
    }
    host.innerHTML = `<div class="player">
      ${pageHeader('Learn', `${learned} / ${queue.length} learned`, `<button class="btn ghost sm" onclick="navigate('vocab')">✕ End</button>`)}
      <div class="bar" style="margin-bottom:16px"><span style="width:${learned / queue.length * 100}%"></span></div>
      <div class="card pad-lg">${body}</div><div id="lfb"></div></div>`;
    if (typed) {
      const inp = $('#lin', host); inp.focus();
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(item, normalizeWord(inp.value) === normalizeWord(c.w)); });
    } else {
      $$('.choice', host).forEach((el) => el.onclick = () => check(item, el.dataset.w.toLowerCase() === c.w.toLowerCase(), el));
    }
  }
  function check(item, correct, el) {
    const c = item.c;
    if (correct) { item.correct++; vocabGrade(c.key, item.correct >= need ? 5 : 4); }
    else { item.correct = 0; vocabGrade(c.key, 2); }
    $('#lfb', host).innerHTML = `<div class="explain ${correct ? 'correct' : 'wrong'}" style="margin-top:14px">
      <b>${correct ? '✓ Correct' : '✗ ' + esc(c.w)}</b> — ${esc(c.def)}${c.ex ? `<div class="muted" style="font-style:italic;margin-top:6px">“${esc(c.ex)}”</div>` : ''}
      <div style="margin-top:10px"><button class="btn sm primary" id="lnext">Next →</button></div></div>`;
    if (el) { el.classList.add(correct ? 'correct' : 'wrong'); }
    $('#lnext', host).focus();
    $('#lnext', host).onclick = next;
    const kn = (e) => { if (e.key === 'Enter') { e.preventDefault(); document.removeEventListener('keydown', kn); next(); } };
    document.addEventListener('keydown', kn, { once: true });
  }
  function finish() {
    host.innerHTML = `<div class="player"><div class="card pad-lg tac"><div style="font-size:2.4rem">🧠</div><h2>All learned!</h2>
      <p class="muted">${queue.length} words practiced to mastery this session.</p><button class="btn primary" onclick="navigate('vocab')">Done</button></div></div>`;
    touchStreak();
  }
  next();
}
function normalizeWord(s) { return String(s || '').trim().toLowerCase().replace(/[^a-z]/g, ''); }

/* ---------- Match (timed grid, personal best per set) ---------- */
function runMatch(set) {
  const host = document.getElementById('view');
  const chosen = shuffle(setCards(set)).slice(0, 6);
  const tiles = shuffle(chosen.flatMap((c) => [{ id: c.key, t: c.w, kind: 'w' }, { id: c.key, t: c.def, kind: 'd' }]));
  let first = null, matched = 0, start = 0, timerId = null, tenths = 0;
  host.innerHTML = `<div class="player">
    ${pageHeader('Match', 'Pair each word with its definition — fast!', `<span class="mono" id="mtimer" style="font-size:1.2rem">0.0s</span> <button class="btn ghost sm" onclick="navigate('vocab')">✕</button>`)}
    <div class="grid" id="mgrid" style="grid-template-columns:repeat(3,1fr);gap:10px">
      ${tiles.map((t, i) => `<div class="card" data-i="${i}" style="cursor:pointer;min-height:84px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:${t.kind === 'w' ? '1.05rem' : '.82rem'}">${esc(t.t)}</div>`).join('')}
    </div></div>`;
  start = performance.now ? 0 : 0;
  timerId = setInterval(() => { tenths++; const el = $('#mtimer', host); if (el) el.textContent = (tenths / 10).toFixed(1) + 's'; }, 100);
  const els = $$('#mgrid .card', host);
  els.forEach((el) => el.onclick = () => {
    const i = parseInt(el.dataset.i); const tile = tiles[i];
    if (el.classList.contains('done') || el === first) return;
    el.style.borderColor = 'var(--violet)';
    if (!first) { first = el; first._i = i; return; }
    const a = tiles[first._i], b = tile;
    if (a.id === b.id && a.kind !== b.kind) {
      [first, el].forEach((x) => { x.classList.add('done'); x.style.background = 'rgba(47,217,166,.18)'; x.style.borderColor = 'var(--mint)'; x.style.pointerEvents = 'none'; });
      matched++; first = null;
      if (matched === chosen.length) finishMatch();
    } else {
      const f = first; el.style.borderColor = 'var(--coral)'; f.style.borderColor = 'var(--coral)';
      setTimeout(() => { el.style.borderColor = ''; f.style.borderColor = ''; }, 450); first = null;
    }
  });
  function finishMatch() {
    clearInterval(timerId);
    const secs = tenths / 10;
    const prev = S.bests.match[set.id];
    const isBest = !prev || secs < prev;
    if (isBest) { S.bests.match[set.id] = secs; save(); }
    touchStreak();
    host.innerHTML = `<div class="player"><div class="card pad-lg tac"><div style="font-size:2.4rem">⚡</div>
      <h2>${secs.toFixed(1)} seconds</h2>${isBest ? '<div class="pill gold">🏆 New personal best!</div>' : `<div class="muted">Personal best: ${fmtClock(prev)}</div>`}
      <div class="row" style="justify-content:center;gap:10px;margin-top:16px"><button class="btn" onclick="runMatch(activeSet())">Again</button><button class="btn primary" onclick="navigate('vocab')">Done</button></div></div></div>`;
  }
}

/* ---------- Cloze (word blanked from a sentence) ---------- */
function runCloze(cards) {
  const host = document.getElementById('view');
  let i = 0;
  function render() {
    if (i >= cards.length) return done();
    const c = cards[i];
    let sentence = c.ex && new RegExp(c.w, 'i').test(c.ex)
      ? c.ex.replace(new RegExp('\\b' + c.w + '\\w*', 'i'), '_____')
      : `Someone described as _____ is best defined as: “${c.def}.”`;
    host.innerHTML = `<div class="player">
      ${pageHeader('Cloze', `${i + 1} / ${cards.length}`, `<button class="btn ghost sm" onclick="navigate('vocab')">✕ End</button>`)}
      <div class="card pad-lg"><div class="stem">Fill in the blank:</div>
        <div class="passage">${esc(sentence)}</div>
        <input type="text" id="czin" placeholder="the missing word…" autocomplete="off"><div class="tag" style="margin-top:6px">Hint: ${esc(c.def)}</div></div>
      <div id="czfb"></div></div>`;
    const inp = $('#czin', host); inp.focus();
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(c, normalizeWord(inp.value) === normalizeWord(c.w)); });
  }
  function check(c, correct) {
    vocabGrade(c.key, correct ? 4 : 2);
    $('#czfb', host).innerHTML = `<div class="explain ${correct ? 'correct' : 'wrong'}" style="margin-top:14px"><b>${correct ? '✓ Correct' : '✗ Answer: ' + esc(c.w)}</b> — ${esc(c.def)}
      <div style="margin-top:10px"><button class="btn sm primary" id="cznext">Next →</button></div></div>`;
    const b = $('#cznext', host); b.focus(); b.onclick = () => { i++; render(); };
  }
  function done() {
    host.innerHTML = `<div class="player"><div class="card pad-lg tac"><div style="font-size:2.4rem">✍️</div><h2>Cloze complete</h2><button class="btn primary" onclick="navigate('vocab')">Done</button></div></div>`;
    touchStreak();
  }
  render();
}

/* ---------- Quiz me (20 mixed MC) ---------- */
function runVocabQuiz(cards) {
  const host = document.getElementById('view');
  const all = setCards(activeSet());
  let i = 0, correct = 0;
  function render() {
    if (i >= cards.length) return done();
    const c = cards[i];
    const wordToDef = Math.random() < 0.5;
    const pool = shuffle(all.filter((x) => x.key !== c.key)).slice(0, 3);
    const opts = shuffle([c].concat(pool));
    host.innerHTML = `<div class="player">
      ${pageHeader('Vocab quiz', `${i + 1} / ${cards.length} · ${correct} correct`, `<button class="btn ghost sm" onclick="navigate('vocab')">✕ End</button>`)}
      <div class="bar" style="margin-bottom:16px"><span style="width:${i / cards.length * 100}%"></span></div>
      <div class="card pad-lg"><div class="stem">${wordToDef ? `What does <b>${esc(c.w)}</b> mean?` : `Which word means: <b>${esc(c.def)}</b>?`}</div>
        <div class="choices">${opts.map((o) => `<div class="choice" data-k="${o.key}"><span class="txt">${esc(wordToDef ? o.def : o.w)}</span></div>`).join('')}</div></div>
      <div id="qzfb"></div></div>`;
    $$('.choice', host).forEach((el) => el.onclick = () => {
      const ok = el.dataset.k === c.key;
      if (ok) correct++;
      vocabGrade(c.key, ok ? 4 : 2);
      $$('.choice', host).forEach((x) => { x.style.pointerEvents = 'none'; if (x.dataset.k === c.key) x.classList.add('correct'); else if (x === el) x.classList.add('wrong'); });
      $('#qzfb', host).innerHTML = `<div class="tac" style="margin-top:14px"><button class="btn primary" id="qznext">${i + 1 >= cards.length ? 'See score' : 'Next →'}</button></div>`;
      const b = $('#qznext', host); b.focus(); b.onclick = () => { i++; render(); };
    });
  }
  function done() {
    const acc = Math.round(correct / cards.length * 100);
    host.innerHTML = `<div class="player"><div class="card pad-lg tac"><div class="eyebrow">Quiz complete</div>
      <div class="stat" style="align-items:center;margin:10px 0"><div class="v" style="font-size:3rem">${acc}%</div><div class="muted">${correct} of ${cards.length} correct</div></div>
      <div class="row" style="justify-content:center;gap:10px"><button class="btn" onclick="runVocabMode('quiz')">Again</button><button class="btn primary" onclick="navigate('vocab')">Done</button></div></div></div>`;
    touchStreak();
  }
  render();
}

  render() {

    <div class="grid g-2" style="align-items:start">

});

      if (!Array.isArray(arr)) { msg.textContent = 'Expected a JSON array.'; msg.style.color = 'var(--coral)'; return; }
      const res = importQuestions(arr);
      msg.style.color = res.added ? 'var(--mint)' : 'var(--coral)';
      msg.textContent = `${res.added} imported${res.skipped ? `, ${res.skipped} skipped (${res.reasons.join('; ')})` : ''}.`;
      if (res.added) toast(`${res.added} questions imported`, 'mint');
    };
  },
});

function importQuestions(arr) {
  let added = 0, skipped = 0; const reasons = new Set();
  for (const q of arr) {
    if (!q || !q.id || !q.skill || !q.stem || q.answer == null) { skipped++; reasons.add('missing fields'); continue; }
    if (!SKILL_BY_ID[q.skill]) { skipped++; reasons.add('bad skill id'); continue; }
    if (BANK_BY_ID[q.id] || S.ai.questions.some((x) => x.id === q.id)) { skipped++; reasons.add('duplicate id'); continue; }
    if (q.type === 'mcq' && (!Array.isArray(q.choices) || q.choices.length < 2)) { skipped++; reasons.add('bad choices'); continue; }
    S.ai.questions.push(Object.assign({}, q, { imported: true }));
    added++;
  }
  if (added) { save(true); buildBank(); }
  return { added, skipped, reasons: Array.from(reasons) };
}

/* =========================================================================
   UI — Sable, the command assistant. Floating orb + Cmd/Ctrl+K command bar,
   a chat panel, rule-based answers with no API key, and full tool-use chat
   with a key. Voice mode via the browser's Web Speech APIs.
   Personality: calm, dry, hyper-competent — an AI butler for your prep.
   ========================================================================= */

/* Live state handed to Sable on every request so it actually knows your prep. */
function sableContext() {
  const proj = projectedScore();
  const weak = weakestSkills(4).map((s) => ({ skill: s.name, id: s.id, mastery: Math.round(getMastery(s.id)) }));
  const li = levelInfo();
  return {
    projected: proj, target: 1600,
    daysUntilTest: daysUntilTest(),
    streak: S.streak.count, level: li.level, title: li.title, xp: S.xp,
    weeklyXP: S.weekly.xp, weeklyGoal: S.weekly.goal,
    sectionMastery: { rw: Math.round(sectionMastery('rw')), math: Math.round(sectionMastery('math')) },
    weakestSkills: weak,
    mistakesDue: dueMistakes().length, mistakesTotal: allMistakes().length,
    answeredAllTime: S.stats.answered, accuracyAllTime: S.stats.answered ? Math.round(S.stats.correct / S.stats.answered * 100) : 0,
    today: { answered: S.today?.answered || 0, correct: S.today?.correct || 0 },
    questComplete: questComplete(),
    diagnosticDone: S.diagnostic.done, mocksDone: S.counters.mocksDone,
    vocabSets: Object.keys(S.vocab.sets).length,
  };
}
function SABLE_SYSTEM() {
  const name = S.settings.assistantName;
  return `You are ${name}, the command assistant inside "Ace", a personal Digital SAT trainer used by one student aiming for a perfect 1600.
Persona: calm, dry, hyper-competent, quietly witty — an AI butler. Concise. Never sycophantic. You address the student directly.
You have their LIVE state as JSON below. Use real numbers from it; never invent stats. Scores are ESTIMATES — say so when it matters.
When the student asks you to DO something (start a drill, mock, vocab session, open a lesson, add a plan task), CALL THE MATCHING TOOL rather than only describing it. Prefer action.
Keep replies to a few sentences unless asked for depth. Use plain text (this renders in a small panel).

LIVE STATE:
${JSON.stringify(sableContext(), null, 0)}`;
}

/* Client-side tools Sable can call. */
const SABLE_TOOLS = [
  { name: 'startDrill', description: 'Start a practice drill. Optionally target a skill id, a section (math|rw), and/or difficulty (1-3).',
    input_schema: { type: 'object', properties: { skill: { type: 'string' }, section: { type: 'string', enum: ['math', 'rw'] }, difficulty: { type: 'integer' }, count: { type: 'integer' } } } },
  { name: 'startVocabSession', description: 'Open the vocabulary study session (daily SRS queue).', input_schema: { type: 'object', properties: {} } },
  { name: 'startMock', description: 'Start a full-length adaptive mock exam.', input_schema: { type: 'object', properties: {} } },
  { name: 'openLesson', description: 'Open the Learn lesson for a given skill id.', input_schema: { type: 'object', properties: { skill: { type: 'string' } }, required: ['skill'] } },
  { name: 'getStats', description: 'Get detailed current stats for a scope: overall|math|rw|mastery|plan.', input_schema: { type: 'object', properties: { scope: { type: 'string' } } } },
  { name: 'addToPlan', description: 'Add a custom task to the study plan / daily quest.', input_schema: { type: 'object', properties: { task: { type: 'string' } }, required: ['task'] } },
];
function runSableTool(name, input) {
  switch (name) {
    case 'startDrill': { const opts = { limit: input.count || 10 }; if (input.skill && SKILL_BY_ID[input.skill]) opts.skill = input.skill; if (input.section) opts.section = input.section; if (input.difficulty) opts.difficulty = input.difficulty; Sable.closePanel(); startDrill(opts); return { ok: true, started: opts }; }
    case 'startVocabSession': { Sable.closePanel(); navigate('vocab'); return { ok: true }; }
    case 'startMock': { Sable.closePanel(); navigate('mocks'); if (typeof startMock === 'function') setTimeout(startMock, 30); return { ok: true }; }
    case 'openLesson': { if (!SKILL_BY_ID[input.skill]) return { ok: false, error: 'unknown skill' }; Sable.closePanel(); navigate('learn', { skill: input.skill }); return { ok: true }; }
    case 'getStats': return { ok: true, stats: sableContext() };
    case 'addToPlan': { generatePlan(); S.plan.tasks.push({ id: uid('t'), type: 'custom', label: input.task, done: false }); const q = getDailyQuest(); if (q.items.length < 5) q.items.push({ id: uid('t'), type: 'custom', label: input.task, done: false }); save(); return { ok: true }; }
    default: return { ok: false, error: 'unknown tool' };
  }
}

/* ---------- The Sable object (panel, command bar, chat, voice) ---------- */
const Sable = (() => {
  let panel = null, history = [], voiceReady = false, recog = null, listening = false, chosenVoice = null;

  function ensurePanel() {
    if (panel) return panel;
    panel = document.createElement('div');
    panel.className = 'sable-panel';
    panel.innerHTML = `
      <div class="sable-head">
        <div class="av"></div>
        <div style="flex:1"><div style="font-weight:700">${esc(S.settings.assistantName)}</div><div class="tag" id="sableSub">at your service</div></div>
        ${'speechSynthesis' in window ? `<button class="btn sm ghost" id="sableVoiceBtn" title="Toggle voice">${S.settings.voice ? '🔊' : '🔇'}</button>` : ''}
        <button class="btn sm ghost" id="sableClose">✕</button>
      </div>
      <div class="sable-msgs" id="sableMsgs"></div>
      <div class="sable-foot">
        <div class="row wrap" id="sableChips" style="gap:6px;margin-bottom:8px"></div>
        <div class="row">
          <input type="text" id="sableIn" placeholder="${aiConfigured() ? 'Ask ' + esc(S.settings.assistantName) + '…' : 'Ask about your stats…'}" autocomplete="off">
          ${('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) ? `<button class="btn" id="sableMic" title="Speak">🎤</button>` : ''}
          <button class="btn primary" id="sableSend">➤</button>
        </div>
      </div>`;
    document.body.appendChild(panel);
    $('#sableClose', panel).onclick = closePanel;
    $('#sableSend', panel).onclick = () => submit();
    $('#sableIn', panel).addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    const vb = $('#sableVoiceBtn', panel); if (vb) vb.onclick = toggleVoiceMode;
    const mic = $('#sableMic', panel); if (mic) mic.onclick = toggleListen;
    renderChips();
    if (!history.length) greet();
    return panel;
  }

  function greet() {
    pushMsg('sable', templateBriefing());
  }
  function renderChips() {
    const chips = [
      ['What should I work on?', 'work'],
      ['Am I on pace for 1600?', 'pace'],
      ['How am I trending in math?', 'math'],
      ['Review my mistakes', 'mistakes'],
    ];
    const host = $('#sableChips', panel);
    host.innerHTML = chips.map(([t, k]) => `<button class="btn sm ghost" data-chip="${k}">${esc(t)}</button>`).join('');
    $$('[data-chip]', host).forEach((b) => b.onclick = () => { $('#sableIn', panel).value = b.textContent; submit(); });
  }

  function pushMsg(who, text) {
    history.push({ who, text });
    const box = $('#sableMsgs', panel);
    const el = document.createElement('div');
    el.className = 'bub ' + (who === 'me' ? 'me' : who === 'tool' ? 'tool' : 'sable');
    el.innerHTML = (who === 'sable' ? `<div class="who">${esc(S.settings.assistantName)}</div>` : '') + mathToHtml(text);
    box.appendChild(el); typeset(el); box.scrollTop = box.scrollHeight;
    if (who === 'sable' && S.settings.voice) speak(text);
    return el;
  }
  function setSub(t) { const s = $('#sableSub', panel); if (s) s.textContent = t; }

  async function submit() {
    const inp = $('#sableIn', panel); const text = inp.value.trim(); if (!text) return;
    inp.value = ''; pushMsg('me', text);
    // Try a rule-based answer first (works with no key); if AI available, prefer it for freeform.
    if (!aiConfigured()) { pushMsg('sable', ruleBasedAnswer(text)); return; }
    setSub('thinking…'); orbBusy(true);
    try { await chatWithTools(text); } catch (e) { pushMsg('sable', 'I hit a snag: ' + e.message); }
    setSub('at your service'); orbBusy(false);
  }

  // Full tool-use loop against the Messages API.
  async function chatWithTools(userText) {
    const messages = history.filter((m) => m.who === 'me' || m.who === 'sable')
      .slice(-8).map((m) => ({ role: m.who === 'me' ? 'user' : 'assistant', content: m.text }));
    // ensure the latest user turn is present
    if (!messages.length || messages[messages.length - 1].role !== 'user') messages.push({ role: 'user', content: userText });
    let guard = 0;
    while (guard++ < 5) {
      const data = await aiCall({ system: SABLE_SYSTEM(), messages, tools: SABLE_TOOLS, max_tokens: 900, temperature: 0.6 });
      const blocks = data.content || [];
      const text = blocks.filter((b) => b.type === 'text').map((b) => b.text).join('\n').trim();
      const toolUses = blocks.filter((b) => b.type === 'tool_use');
      if (text) pushMsg('sable', text);
      if (!toolUses.length || data.stop_reason !== 'tool_use') return;
      messages.push({ role: 'assistant', content: blocks });
      const results = [];
      for (const tu of toolUses) {
        const out = runSableTool(tu.name, tu.input || {});
        pushMsg('tool', `↳ ${tu.name}(${JSON.stringify(tu.input || {})})`);
        results.push({ type: 'tool_result', tool_use_id: tu.id, content: JSON.stringify(out) });
      }
      messages.push({ role: 'user', content: results });
    }
  }

  // Rule-based answers (no API key) — canned but data-driven.
  function ruleBasedAnswer(q) {
    const t = q.toLowerCase();
    const ctx = sableContext();
    if (/pace|1600|on track|track|ready/.test(t)) {
      const gap = 1600 - ctx.projected.total;
      const dd = ctx.daysUntilTest;
      return `Projected total is about ${ctx.projected.total} — roughly ${gap} shy of 1600 (an estimate). ` +
        (dd != null ? `${dd} days remain. ` : 'No test date set. ') +
        `Close the gap where it's cheapest: ${ctx.weakestSkills.slice(0, 2).map((w) => w.skill).join(' and ')}.`;
    }
    if (/math/.test(t)) return `Math mastery averages ${ctx.sectionMastery.math}/100, projecting about ${ctx.projected.math}. Weakest math skill on file: ${weakestSkills(1, 'math')[0]?.name || '—'}. Shall I run a drill? Type: drill math.`;
    if (/reading|writing|\brw\b|verbal|english/.test(t)) return `Reading & Writing mastery averages ${ctx.sectionMastery.rw}/100, projecting about ${ctx.projected.rw}. Weakest: ${weakestSkills(1, 'rw')[0]?.name || '—'}.`;
    if (/work on|study|focus|today|next|should/.test(t)) return `Today I'd focus on ${ctx.weakestSkills.slice(0, 2).map((w) => `${w.skill} (${w.mastery})`).join(' and ')}. ${ctx.mistakesDue ? `You also have ${ctx.mistakesDue} mistakes due. ` : ''}Say "drill" and I'll start one.`;
    if (/mistake/.test(t)) { closePanel(); navigate('mistakes'); return `Opening your mistake bank — ${ctx.mistakesDue} due now.`; }
    if (/drill/.test(t)) { const sec = /math/.test(t) ? 'math' : /read|writ|rw/.test(t) ? 'rw' : null; closePanel(); startDrill(sec ? { section: sec, limit: 10 } : { skill: weakestSkills(1)[0].id, limit: 10 }); return 'Starting a drill.'; }
    if (/streak/.test(t)) return `Your streak is ${ctx.streak} days. ${ctx.questComplete ? 'Today is already secured.' : 'Finish today\'s quest to extend it.'}`;
    if (/vocab|word/.test(t)) { closePanel(); navigate('vocab'); return 'Opening vocabulary.'; }
    if (/mock|exam|test/.test(t)) { closePanel(); navigate('mocks'); return 'Heading to mock exams.'; }
    if (/level|xp/.test(t)) return `You're level ${ctx.level} — ${ctx.title} — with ${ctx.xp} XP. Weekly: ${ctx.weeklyXP}/${ctx.weeklyGoal}.`;
    if (/hello|hi|hey|help/.test(t)) return `At your service. Ask about your pace, what to work on, or say "drill math". For freeform conversation, add an API key in Settings.`;
    return `Without an API key I answer from your stats only. Try: "what should I work on", "am I on pace for 1600", "drill math", or "review my mistakes". Add a key in Settings for full conversation.`;
  }

  /* ---------- voice ---------- */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices();
    const prefer = ['Daniel', 'Google UK English Male', 'Arthur', 'Oliver', 'Microsoft Ryan', 'en-GB'];
    for (const p of prefer) { const v = vs.find((x) => x.name.includes(p) || x.lang === p); if (v) return v; }
    return vs.find((x) => /en/i.test(x.lang)) || vs[0] || null;
  }
  function speak(text) {
    if (!('speechSynthesis' in window) || !S.settings.voice) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/[*_#`$]/g, '')); chosenVoice = chosenVoice || pickVoice(); if (chosenVoice) u.voice = chosenVoice; u.rate = 1.0; u.pitch = 0.9; speechSynthesis.speak(u); } catch (e) { }
  }
  function initVoice() {
    if ('speechSynthesis' in window) { chosenVoice = pickVoice(); if (!chosenVoice) speechSynthesis.onvoiceschanged = () => { chosenVoice = pickVoice(); }; }
  }
  function toggleVoiceMode() { S.settings.voice = !S.settings.voice; save(true); const b = $('#sableVoiceBtn', panel); if (b) b.textContent = S.settings.voice ? '🔊' : '🔇'; if (S.settings.voice) { initVoice(); speak('Voice enabled.'); } else speechSynthesis.cancel(); }
  function toggleListen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast('Speech input not available in this browser.', 'coral');
    if (listening) { recog && recog.stop(); return; }
    try {
      recog = new SR(); recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 1;
      listening = true; const mic = $('#sableMic', panel); if (mic) mic.textContent = '⏹️';
      recog.onresult = (e) => { const txt = e.results[0][0].transcript; $('#sableIn', panel).value = txt; };
      recog.onend = () => { listening = false; const m = $('#sableMic', panel); if (m) m.textContent = '🎤'; if ($('#sableIn', panel).value.trim()) submit(); };
      recog.onerror = () => { listening = false; const m = $('#sableMic', panel); if (m) m.textContent = '🎤'; toast('Mic error — if on file://, use typed input.', 'coral'); };
      recog.start();
    } catch (e) { toast('Speech input blocked (common on file://). Type instead.', 'coral'); listening = false; }
  }

  function orbBusy(on) { const o = document.getElementById('sableOrb'); if (o) o.classList.toggle('busy', on); }
  function openPanel() { ensurePanel(); panel.classList.add('open'); setTimeout(() => $('#sableIn', panel)?.focus(), 60); }
  function closePanel() { if (panel) panel.classList.remove('open'); }
  function togglePanel() { ensurePanel(); panel.classList.contains('open') ? closePanel() : openPanel(); }
  function ask(text) { openPanel(); $('#sableIn', panel).value = text; submit(); }

  return { togglePanel, openPanel, closePanel, ask, initVoice, speak, ensurePanel, _rule: ruleBasedAnswer };
})();

/* ---------- Command bar (Cmd/Ctrl+K) ---------- */
const CommandBar = (() => {
  let overlay = null, actions = [], hi = 0, filtered = [];
  function baseActions() {
    const nav = NAV.map((n) => ({ icon: n.icon, t: n.label, d: 'Go to ' + n.label, run: () => navigate(n.route) }));

      { icon: '💀', t: 'Extreme mode', d: 'Hardest questions', run: () => navigate('extreme') },
      { icon: '📝', t: 'Start a mock exam', d: 'Full adaptive test', run: () => navigate('mocks') },

    actions = baseActions();
    overlay = document.createElement('div');
    overlay.className = 'cmd-overlay';
    overlay.innerHTML = `<div class="cmd"><div class="cmd-in"><span class="dot"></span><input id="cmdIn" placeholder="Type a command or ask ${esc(S.settings.assistantName)}…" autocomplete="off"></div>
      <div class="cmd-body" id="cmdBody"></div>
      <div class="cmd-hint"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span>${aiConfigured() ? '<span>type a question, then ↵ to ask</span>' : ''}</div></div>`;
    document.body.appendChild(overlay);
    const inp = $('#cmdIn', overlay);
    inp.addEventListener('input', () => refresh(inp.value));
    inp.addEventListener('keydown', onKey);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    refresh('');
    setTimeout(() => inp.focus(), 30);
  }
  function refresh(q) {
    hi = 0;
    const query = q.trim().toLowerCase();
    filtered = !query ? actions : actions.filter((a) => (a.t + ' ' + a.d).toLowerCase().includes(query));
    const body = $('#cmdBody', overlay);
    let html = filtered.slice(0, 8).map((a, i) => `<div class="cmd-act ${i === hi ? 'hi' : ''}" data-i="${i}"><span class="ico">${a.icon}</span><div><div class="t">${esc(a.t)}</div><div class="d">${esc(a.d)}</div></div></div>`).join('');
    if (query && aiConfigured()) html = `<div class="cmd-act ask ${filtered.length === 0 ? 'hi' : ''}" data-ask="1"><span class="ico">💬</span><div><div class="t">Ask ${esc(S.settings.assistantName)}: “${esc(q)}”</div><div class="d">Freeform — Sable can act on it</div></div></div>` + html;
    body.innerHTML = html || `<div class="muted" style="padding:14px">No matches. ${aiConfigured() ? '' : 'Add an API key to ask freeform questions.'}</div>`;
    $$('.cmd-act', body).forEach((el) => el.onclick = () => { if (el.dataset.ask) { const v = $('#cmdIn', overlay).value; close(); Sable.ask(v); } else run(parseInt(el.dataset.i)); });
  }
  function onKey(e) {
    const items = $$('.cmd-act', overlay);
    if (e.key === 'Escape') { close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(items.length - 1, hi + 1); paint(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(0, hi - 1); paint(items); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const el = items[hi];
      if (el && el.dataset.ask) { const v = $('#cmdIn', overlay).value; close(); Sable.ask(v); }
      else { const askOffset = ($('#cmdIn', overlay).value.trim() && aiConfigured()) ? 1 : 0; run(hi - askOffset); }
    }
  }
  function paint(items) { items.forEach((el, i) => el.classList.toggle('hi', i === hi)); }
  function run(i) { const a = filtered[i]; close(); if (a) a.run(); }
  function close() { if (overlay) { overlay.remove(); overlay = null; } }
  function toggle() { overlay ? close() : open(); }
  return { open, close, toggle };
})();

/* AI facade used by the question player's tutor buttons (Phase 5 expands). */
const AI = {
  enabled: () => aiConfigured(),
  async tutorAction(kind, q) {
    const out = document.getElementById('tutorOut'); if (!out) return;
    out.innerHTML = `<div class="tag" style="margin-top:8px">${esc(S.settings.assistantName)} is thinking…</div>`;
    try {
      if (kind === 'explain') {
        const t = await aiText(SABLE_SYSTEM(), `Explain this SAT question in a different, simpler way than the official explanation. Be concrete and brief.\n\nQuestion: ${q.stem}\n${q.choices ? 'Choices: ' + q.choices.map((c, i) => LETTERS[i] + ') ' + c).join('  ') : ''}\nCorrect answer: ${[].concat(q.answer)[0]}\nOfficial explanation: ${q.explanation}`, { max_tokens: 500 });
        out.innerHTML = `<div class="explain" style="margin-top:10px"><div class="who" style="color:var(--ace);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em">${esc(S.settings.assistantName)} · another angle</div>${mathToHtml(t)}</div>`; typeset(out);
      } else if (kind === 'similar') {
        out.innerHTML = `<div class="tag" style="margin-top:8px">Generating 3 similar questions…</div>`;
        const n = await AI.generateSimilar(q, 3);
        out.innerHTML = `<div class="explain" style="margin-top:10px">Added <b>${n}</b> AI-generated question${n === 1 ? '' : 's'} on ${esc(SKILL_BY_ID[q.skill].name)} to your drills. <button class="btn sm" onclick="navigate('drills',{skill:'${q.skill}'})">Drill them →</button></div>`;
      } else if (kind === 'chat') {
        Sable.ask(`Coach me through this question without giving the answer away immediately: "${q.stem}". I answered ${q.type === 'spr' ? 'wrong' : ''}. The correct answer is ${[].concat(q.answer)[0]}.`);
      }
    } catch (e) { out.innerHTML = `<div class="tag" style="color:var(--coral);margin-top:8px">${esc(e.message)}</div>`; }
  },
  async generateSimilar(q, count = 3) {
    const schema = `Return ONLY a JSON array of ${count} objects, no prose. Each: {"skill":"${q.skill}","difficulty":${q.difficulty === 'extreme' ? '"extreme"' : q.difficulty},"type":"${q.type}","stem":"...","choices":["a","b","c","d"](omit for spr),"answer":"${q.type === 'mcq' ? 'A-D letter' : 'numeric string'}","explanation":"full worked solution + why wrong choices are wrong"}. Use $...$ for math.`;
    const t = await aiText('You are an expert Digital SAT item writer. Output valid JSON only.', `Write ${count} NEW questions similar to this one (same skill and difficulty), original stems:\n\n${q.stem}\n\n${schema}`, { max_tokens: 1600, temperature: 0.9 });
    let arr; try { arr = JSON.parse(t.replace(/^```json?/i, '').replace(/```$/, '').trim()); } catch (e) { throw new Error('Could not parse generated questions.'); }
    let added = 0;
    for (const item of arr) {
      const id = 'AI_' + uid('q');
      if (!item.stem || item.answer == null) continue;
      S.ai.questions.push(Object.assign({ id, skill: q.skill, difficulty: q.difficulty, type: q.type }, item, { id, aiGenerated: true }));
      added++;
    }
    if (added) { save(true); buildBank(); }
    return added;
  },
};

/* =========================================================================
   BOOT — wire everything together and start the app.
   ========================================================================= */

// Expose const-defined singletons so inline onclick="Sable.x()" handlers (which
// run in global scope) can reach them. Top-level function declarations are
// already global; const objects are not, so publish them explicitly.
window.Sable = Sable;
window.CommandBar = CommandBar;
window.AI = AI;

function boot() {
  loadState();
  ensureToday();
  buildBank();
  buildLessons();
  buildPath();
  rolloverWeekIfNeeded();
  generatePlan();          // ensure a plan/quest exists
  save();

  if (S.settings.voice) Sable.initVoice();

  // Global keyboard shortcuts.
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); CommandBar.toggle(); }
    else if (e.key === 'Escape') { CommandBar.close(); }
  });

  window.addEventListener('hashchange', router);
  if (!location.hash) location.hash = '#/home';
  router();

  // Re-typeset math once the deferred KaTeX script is ready.
  if (!katexReady()) {
    let tries = 0;
    const iv = setInterval(() => { if (katexReady() || tries++ > 40) { clearInterval(iv); typeset(document); } }, 150);
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
