<!doctype html>
<!--
  Ace — a personal, offline-first Digital SAT trainer (single file).
  (Full usage notes are finalized in the last build phase.)

-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Ace — Digital SAT Trainer</title>
<meta name="description" content="Ace: a personal, offline-first Digital SAT trainer. Learn, drill, master, and take full adaptive mock exams — with Sable, your command assistant.">

<!--
  KaTeX is the ONLY external dependency (math rendering). It is loaded from a CDN
  but the app degrades gracefully to plain-text math when offline: see mathRender()
  in the ENGINE section, which checks window.katex before using it.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      onerror="window.__KATEX_CSS_FAILED=true">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        onerror="window.__KATEX_JS_FAILED=true"></script>

<style>
/* =========================================================================
   STYLES — Ace design system
   Identity: "Observatory" — a deep indigo command-center with a warm amber
   signature (the Ace star + the winding skill path), plus violet / mint /
   coral / sky data hues. Test mode switches to a quiet Bluebook-like light
   surface. Display serif + system sans + mono console.
   ========================================================================= */

:root {
  /* ---- core palette (6 named hues) ---- */
  --midnight: #14162b;   /* app background base */
  --night:    #1b1e3a;   /* raised panels */
  --slate:    #262a4d;   /* cards */
  --ace:      #ffc247;   /* signature amber-gold: stars, XP, streak, path */
  --violet:   #7b6cf6;   /* primary interactive */
  --mint:     #2fd9a6;   /* success / high mastery */
  --coral:    #ff5d73;   /* error / hearts / mistakes */
  --sky:      #47c6f4;   /* info / secondary data */

  /* ---- derived surfaces & text ---- */
  --bg:        #0f1122;
  --surface:   var(--night);
  --card:      var(--slate);
  --line:      #33385f;
  --line-soft: #282d52;
  --fg:        #eef0ff;
  --muted:     #9aa0c8;
  --faint:     #6b719c;
  --violet-2:  #a99cff;
  --ace-2:     #ffd888;

  --radius:   16px;
  --radius-s: 10px;
  --radius-l: 24px;
  --shadow:   0 18px 48px -24px rgba(0,0,0,.75);
  --shadow-s: 0 8px 24px -14px rgba(0,0,0,.7);
  --ring:     0 0 0 3px rgba(123,108,246,.45);

  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;

  --maxw: 1120px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-body);
  color: var(--fg);
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(123,108,246,.16), transparent 60%),
    radial-gradient(1000px 620px at 8% 4%, rgba(255,194,71,.08), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0 0 .4em; letter-spacing: .2px; }
h1 { font-size: clamp(1.7rem, 3vw, 2.4rem); }
h2 { font-size: clamp(1.35rem, 2.2vw, 1.8rem); }
h3 { font-size: 1.18rem; }
p { margin: 0 0 .8em; }
a { color: var(--violet-2); text-decoration: none; }
a:hover { text-decoration: underline; }
small { color: var(--muted); }
code, kbd { font-family: var(--font-mono); }
kbd {
  background: var(--midnight); border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 6px; padding: .05em .45em;
  font-size: .82em; color: var(--fg);
}
::selection { background: rgba(123,108,246,.4); }

/* Focus visibility (accessibility requirement) */
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---- layout shell ---- */
#app { min-height: 100vh; }
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.main { min-width: 0; padding: 26px clamp(16px, 3vw, 40px) 120px; max-width: var(--maxw); margin: 0 auto; width: 100%; }

/* ---- sidebar nav ---- */
.sidebar {
  position: sticky; top: 0; align-self: start; height: 100vh;
  background: linear-gradient(180deg, rgba(27,30,58,.92), rgba(15,17,34,.92));
  border-right: 1px solid var(--line-soft);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;
  backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
.brand .mark {
  width: 34px; height: 34px; flex: none; border-radius: 10px;
  display: grid; place-items: center; font-family: var(--font-display);
  font-weight: 700; color: var(--midnight); font-size: 1.25rem;
  background: linear-gradient(150deg, var(--ace), #ff9e3d);
  box-shadow: 0 6px 18px -6px rgba(255,194,71,.7);
}
.brand .name { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; letter-spacing: .5px; }
.brand .name b { color: var(--ace); }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px;
  color: var(--muted); cursor: pointer; border: 1px solid transparent; user-select: none;
  font-size: .93rem; transition: background .15s, color .15s;
}
.nav-item .ico { width: 20px; text-align: center; font-size: 1.05rem; flex: none; }
.nav-item:hover { background: rgba(123,108,246,.1); color: var(--fg); }
.nav-item.active { background: linear-gradient(90deg, rgba(123,108,246,.24), rgba(123,108,246,.05)); color: var(--fg); border-color: rgba(123,108,246,.35); }
.nav-item.active .ico { color: var(--violet-2); }
.nav-sep { height: 1px; background: var(--line-soft); margin: 10px 6px; }
.nav-foot { margin-top: auto; font-size: .72rem; color: var(--faint); padding: 8px; }

/* ---- generic surfaces ---- */
.card {
  background: linear-gradient(180deg, rgba(38,42,77,.75), rgba(27,30,58,.75));
  border: 1px solid var(--line-soft); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow-s);
}
.card.pad-lg { padding: 24px; }
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, 1fr); }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.row { display: flex; gap: 12px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.tar { text-align: right; }
.tac { text-align: center; }
.mono { font-family: var(--font-mono); }
.hidden { display: none !important; }
.eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: .7rem; color: var(--faint); font-weight: 700; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  padding: 10px 16px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--slate); color: var(--fg); cursor: pointer; font-weight: 600;
  font-size: .92rem; transition: transform .06s, background .15s, border-color .15s;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--violet); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(150deg, var(--violet), #6152d8); border-color: transparent; color: #fff; box-shadow: 0 10px 26px -12px rgba(123,108,246,.8); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: linear-gradient(150deg, var(--ace), #ff9e3d); border-color: transparent; color: #241a00; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: .84rem; border-radius: 9px; }
.btn.lg { padding: 13px 22px; font-size: 1rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }

/* ---- pills / tags / chips ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; border: 1px solid var(--line); color: var(--muted); }
.pill.gold  { color: var(--ace);    border-color: rgba(255,194,71,.4);  background: rgba(255,194,71,.08); }
.pill.violet{ color: var(--violet-2);border-color: rgba(123,108,246,.4); background: rgba(123,108,246,.1); }
.pill.mint  { color: var(--mint);   border-color: rgba(47,217,166,.4);  background: rgba(47,217,166,.08); }
.pill.coral { color: var(--coral);  border-color: rgba(255,93,115,.4);  background: rgba(255,93,115,.08); }
.pill.sky   { color: var(--sky);    border-color: rgba(71,198,244,.4);  background: rgba(71,198,244,.08); }
.tag { font-size: .72rem; color: var(--faint); font-family: var(--font-mono); }

/* difficulty dots */
.diff { display: inline-flex; gap: 3px; vertical-align: middle; }
.diff i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); display: inline-block; }
.diff.d1 i:nth-child(1), .diff.d2 i:nth-child(-n+2), .diff.d3 i { background: var(--ace); }
.diff.dx i { background: var(--coral); }

/* ---- progress + meters ---- */
.bar { height: 9px; border-radius: 999px; background: var(--midnight); overflow: hidden; border: 1px solid var(--line-soft); }
.bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--violet-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.gold > span { background: linear-gradient(90deg, #ff9e3d, var(--ace)); }
.bar.mint > span { background: linear-gradient(90deg, #17b98a, var(--mint)); }

/* ---- stat tiles ---- */
.stat { display: flex; flex-direction: column; gap: 3px; }
.stat .k { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.stat .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; }
.stat .v small { font-size: .9rem; color: var(--muted); font-family: var(--font-body); }

/* ---- inputs ---- */
input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
  background: var(--midnight); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; width: 100%; color: var(--fg);
}
input::placeholder, textarea::placeholder { color: var(--faint); }
textarea { resize: vertical; min-height: 96px; font-family: var(--font-mono); font-size: .86rem; }
label.fld { display: block; margin-bottom: 14px; }
label.fld > span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { display: none; }
.toggle .track { width: 42px; height: 24px; border-radius: 999px; background: var(--midnight); border: 1px solid var(--line); position: relative; transition: background .2s; flex: none; }
.toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.toggle input:checked + .track { background: rgba(47,217,166,.25); border-color: var(--mint); }
.toggle input:checked + .track::after { transform: translateX(18px); background: var(--mint); }

/* =========================================================================
   Heatmap (mastery grid)
   ========================================================================= */
.heat { display: grid; gap: 7px; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
.heat .cell {
  border-radius: 11px; padding: 10px; cursor: pointer; border: 1px solid var(--line-soft);
  background: var(--midnight); position: relative; overflow: hidden; min-height: 66px;
  display: flex; flex-direction: column; justify-content: space-between; transition: transform .08s;
}
.heat .cell:hover { transform: translateY(-2px); border-color: var(--violet); }
.heat .cell .lbl { font-size: .74rem; line-height: 1.2; color: var(--fg); z-index: 1; }
.heat .cell .sc { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; z-index: 1; }
.heat .cell .fill { position: absolute; inset: 0; opacity: .9; }
/* mastery color ramp applied inline via --m (0..100) helper classes */
.m0 { background: linear-gradient(160deg, #3a2130, #2a1622); }   /* 0-19 */
.m1 { background: linear-gradient(160deg, #4a2b2f, #33202b); }   /* 20-39 */
.m2 { background: linear-gradient(160deg, #4f4326, #2f2a30); }   /* 40-59 */
.m3 { background: linear-gradient(160deg, #2f4a44, #24333c); }   /* 60-79 */
.m4 { background: linear-gradient(160deg, #1f5f4a, #1c4a4a); }   /* 80-89 */
.m5 { background: linear-gradient(160deg, #216b4f, #2b5a86); box-shadow: inset 0 0 0 1px rgba(255,194,71,.5); } /* 90-100 challenge zone */

/* =========================================================================
   Skill path (signature element) — winding constellation
   ========================================================================= */
.path-wrap { position: relative; padding: 10px 0 40px; }
.path-unit-h { display: flex; align-items: center; gap: 12px; margin: 28px 0 6px; }
.path-unit-h .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ace); box-shadow: 0 0 0 4px rgba(255,194,71,.18); }
.path-nodes { position: relative; }
.node {
  position: relative; width: 74px; height: 74px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; margin: 8px 0; border: 2px solid var(--line);
  background: radial-gradient(circle at 50% 35%, var(--slate), var(--night));
  transition: transform .1s; z-index: 2;
}
.node:hover { transform: scale(1.06); }
.node .ic { font-size: 1.5rem; }
.node .cap { position: absolute; top: 82px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .74rem; color: var(--muted); }
.node.locked { opacity: .5; cursor: not-allowed; filter: grayscale(.6); }
.node.done { border-color: var(--mint); background: radial-gradient(circle at 50% 35%, rgba(47,217,166,.35), var(--night)); }
.node.done .ic { color: var(--mint); }
.node.current { border-color: var(--ace); box-shadow: 0 0 0 6px rgba(255,194,71,.14), 0 0 26px -4px rgba(255,194,71,.6); }
.node.current::after { content: "★"; position: absolute; top: -14px; color: var(--ace); font-size: .9rem; }
.node .ring { position: absolute; inset: -2px; border-radius: 50%; }

/* =========================================================================
   Question player
   ========================================================================= */
.player { max-width: 820px; margin: 0 auto; }
.passage { background: var(--midnight); border: 1px solid var(--line-soft); border-left: 3px solid var(--sky); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; font-size: 1.02rem; line-height: 1.65; }
.stem { font-size: 1.12rem; line-height: 1.6; margin-bottom: 18px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--night); cursor: pointer; transition: border-color .12s, background .12s;
}
.choice:hover { border-color: var(--violet); }
.choice .key { width: 26px; height: 26px; flex: none; border-radius: 7px; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-family: var(--font-mono); font-size: .85rem; }
.choice.sel { border-color: var(--violet); background: rgba(123,108,246,.14); }
.choice.sel .key { background: var(--violet); border-color: var(--violet); color: #fff; }
.choice.correct { border-color: var(--mint); background: rgba(47,217,166,.14); }
.choice.correct .key { background: var(--mint); border-color: var(--mint); color: #05231a; }
.choice.wrong { border-color: var(--coral); background: rgba(255,93,115,.13); }
.choice.wrong .key { background: var(--coral); border-color: var(--coral); color: #2a0710; }
.choice.struck { opacity: .45; }
.choice.struck .txt { text-decoration: line-through; }
.choice .elim { margin-left: auto; opacity: 0; font-size: .8rem; color: var(--faint); background: none; border: none; cursor: pointer; padding: 4px; }
.choice:hover .elim { opacity: 1; }
.spr-input { max-width: 260px; }
.explain { margin-top: 18px; border-radius: 12px; border: 1px solid var(--line-soft); background: var(--midnight); padding: 16px 18px; }
.explain h4 { margin-top: 0; }
.explain.correct { border-left: 3px solid var(--mint); }
.explain.wrong { border-left: 3px solid var(--coral); }

/* =========================================================================
   TEST MODE — quiet, clean, Bluebook-like (light surface)
   ========================================================================= */
.testmode { background: #f4f5f8; color: #1b1f2a; min-height: 100vh; font-family: var(--font-body); }
.testmode .test-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; border-bottom: 1px solid #d7dbe6; background: #fff; position: sticky; top: 0; z-index: 5; }
.testmode .test-title { font-weight: 700; font-size: .95rem; }
.testmode .test-timer { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700; background: #eef0f6; padding: 6px 14px; border-radius: 8px; border: 1px solid #d7dbe6; cursor: pointer; }
.testmode .test-timer.low { color: #c0384f; border-color: #e2b3bd; }
.testmode .test-body { max-width: 1080px; margin: 0 auto; padding: 26px 22px 140px; }
.testmode .test-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.testmode .passage { background: #fff; border-color: #dfe3ee; border-left-color: #2b6cb0; color: #232838; }
.testmode .stem { color: #1b1f2a; }
.testmode .choice { background: #fff; border-color: #cfd4e2; color: #232838; }
.testmode .choice:hover { border-color: #2b6cb0; }
.testmode .choice .key { border-color: #b9c0d4; }
.testmode .choice.sel { border-color: #2b6cb0; background: #e8f0fb; }
.testmode .choice.sel .key { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
.testmode .choice.struck { opacity: .5; }
.testmode input { background: #fff; border-color: #cfd4e2; color: #1b1f2a; }
.testmode .test-foot { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #d7dbe6; padding: 12px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.testmode .btn { background: #eef0f6; color: #1b1f2a; border-color: #cfd4e2; }
.testmode .btn.primary { background: #2b6cb0; color: #fff; border-color: transparent; box-shadow: none; }
.testmode .btn.ghost { background: transparent; }
.testmode .qflag { color: #b0851b; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px,1fr)); gap: 8px; max-width: 460px; }
.navgrid .qb { aspect-ratio: 1; border: 1px solid #cfd4e2; border-radius: 8px; background: #fff; cursor: pointer; font-weight: 700; font-family: var(--font-mono); position: relative; color: #1b1f2a; }
.navgrid .qb.answered { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
.navgrid .qb.current { outline: 2px solid #b0851b; outline-offset: 1px; }
.navgrid .qb.flagged::after { content: "⚑"; position: absolute; top: -6px; right: -4px; color: #c0851b; font-size: .8rem; }
.break-screen { max-width: 560px; margin: 8vh auto; text-align: center; }

/* =========================================================================
   Sable — assistant orb + command bar
   ========================================================================= */
.orb {
  position: fixed; right: 22px; bottom: 22px; width: 58px; height: 58px; border-radius: 50%;
  cursor: pointer; z-index: 60; border: none; display: grid; place-items: center;
  background: radial-gradient(circle at 38% 32%, #8b7dff, #5a49d0 60%, #3d2fb0);
  box-shadow: 0 12px 34px -8px rgba(123,108,246,.7), inset 0 0 18px rgba(255,255,255,.18);
  animation: orbpulse 5s ease-in-out infinite;
}
.orb::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 40% 34%, rgba(255,255,255,.55), transparent 42%); }
.orb .core { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 3px rgba(255,255,255,.75); z-index: 1; }
.orb.busy { animation: orbspin 1s linear infinite; }
@keyframes orbpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes orbspin { to { box-shadow: 0 12px 34px -8px rgba(123,108,246,.9), inset 0 0 26px rgba(255,255,255,.4); } }

.cmd-overlay { position: fixed; inset: 0; background: rgba(6,7,18,.6); backdrop-filter: blur(4px); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.cmd {
  width: min(680px, 92vw); background: #1a1d38; border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
}
.cmd .cmd-in { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
.cmd .cmd-in .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 12px var(--violet); flex: none; }
.cmd .cmd-in input { border: none; background: none; font-size: 1.05rem; padding: 0; }
.cmd .cmd-in input:focus-visible { box-shadow: none; }
.cmd .cmd-body { max-height: 52vh; overflow-y: auto; padding: 10px; }
.cmd .cmd-hint { padding: 10px 14px; color: var(--faint); font-size: .8rem; border-top: 1px solid var(--line-soft); display: flex; gap: 14px; flex-wrap: wrap; }
.cmd-act { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.cmd-act:hover, .cmd-act.hi { background: rgba(123,108,246,.16); }
.cmd-act .ico { width: 22px; text-align: center; }
.cmd-act .t { font-weight: 600; }
.cmd-act .d { font-size: .78rem; color: var(--muted); }

/* chat bubbles (Sable panel + tutor) */
.chat { display: flex; flex-direction: column; gap: 10px; }
.bub { padding: 11px 14px; border-radius: 14px; max-width: 88%; line-height: 1.5; font-size: .93rem; }
.bub.me { align-self: flex-end; background: var(--violet); color: #fff; border-bottom-right-radius: 4px; }
.bub.sable { align-self: flex-start; background: var(--midnight); border: 1px solid var(--line-soft); border-bottom-left-radius: 4px; }
.bub.sable .who { font-size: .68rem; color: var(--ace); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 3px; font-weight: 700; }
.bub.tool { align-self: center; font-family: var(--font-mono); font-size: .78rem; color: var(--mint); background: rgba(47,217,166,.08); border: 1px solid rgba(47,217,166,.25); border-radius: 10px; padding: 6px 10px; }

/* Sable side panel */
.sable-panel { position: fixed; top: 0; right: 0; height: 100vh; width: min(400px, 94vw); background: linear-gradient(180deg, #1c1f3c, #14162b); border-left: 1px solid var(--line); z-index: 70; display: flex; flex-direction: column; box-shadow: -20px 0 60px -30px #000; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.sable-panel.open { transform: translateX(0); }
.sable-head { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 12px; }
.sable-head .av { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #8b7dff, #4a3bc0); flex: none; }
.sable-msgs { flex: 1; overflow-y: auto; padding: 16px; }
.sable-foot { padding: 12px; border-top: 1px solid var(--line-soft); }
.sable-foot .row { gap: 8px; }

/* =========================================================================
   Misc: toast, modal, badges, briefing, home hero
   ========================================================================= */
.toast-wrap { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: #1c1f3c; border: 1px solid var(--line); border-left: 3px solid var(--violet); border-radius: 12px; padding: 11px 16px; box-shadow: var(--shadow); animation: toastin .3s ease; max-width: 92vw; }
.toast.gold { border-left-color: var(--ace); }
.toast.mint { border-left-color: var(--mint); }
.toast.coral { border-left-color: var(--coral); }
@keyframes toastin { from { transform: translateY(12px); opacity: 0; } }

.modal-overlay { position: fixed; inset: 0; background: rgba(6,7,18,.68); backdrop-filter: blur(4px); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { width: min(640px, 96vw); max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; }

.badge-chip { display: flex; gap: 11px; align-items: center; padding: 11px; border-radius: 12px; border: 1px solid var(--line-soft); background: var(--midnight); }
.badge-chip .em { font-size: 1.7rem; filter: grayscale(1) opacity(.4); }
.badge-chip.earned .em { filter: none; }
.badge-chip.earned { border-color: rgba(255,194,71,.35); background: rgba(255,194,71,.06); }

.briefing { position: relative; overflow: hidden; }
.briefing .glow { position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(123,108,246,.4), transparent 70%); pointer-events: none; }
.readiness { display: flex; align-items: center; gap: 18px; }
.gauge { --p: 0; width: 128px; height: 128px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ace) calc(var(--p)*1%), var(--midnight) 0); position: relative; }
.gauge::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--surface); }
.gauge .g-in { position: relative; text-align: center; }
.gauge .g-in b { font-family: var(--font-display); font-size: 1.7rem; display: block; }

.flame { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--ace); }
.flame .f { filter: drop-shadow(0 0 6px rgba(255,150,40,.7)); }

.quest-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line-soft); background: var(--midnight); }
.quest-item.done { opacity: .6; }
.quest-item .ck { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.quest-item.done .ck { background: var(--mint); border-color: var(--mint); color: #05231a; }

.hearts { display: inline-flex; gap: 3px; }
.hearts .h { color: var(--coral); }
.hearts .h.lost { color: var(--line); }

/* combo flash */
.combo { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--ace); text-shadow: 0 0 20px rgba(255,194,71,.6); pointer-events: none; z-index: 150; animation: comboPop .8s ease forwards; }
@keyframes comboPop { 0% { transform: translate(-50%, 10px) scale(.7); opacity: 0; } 30% { opacity: 1; transform: translate(-50%,0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%,-20px) scale(1); } }

/* KaTeX fallback: keep plain text readable */
.math-fallback { font-family: var(--font-mono); background: rgba(123,108,246,.1); padding: 0 3px; border-radius: 4px; }

/* svg charts */
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .axis { stroke: var(--line); }
.chart .grid { stroke: var(--line-soft); }

/* =========================================================================
   Responsive
   ========================================================================= */
.menu-btn { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; z-index: 100; width: 240px; transform: translateX(-100%); transition: transform .25s; }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: inline-grid; place-items: center; position: fixed; top: 14px; left: 14px; z-index: 40; width: 42px; height: 42px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
  .main { padding-top: 64px; }
  .g-2, .g-3, .g-4 { grid-template-columns: 1fr; }
  .testmode .test-cols { grid-template-columns: 1fr; }
  .readiness { flex-direction: column; text-align: center; }
}
@media (max-width: 560px) {
  .g-3, .g-4 { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

</style>

<body>
<noscript><div style="padding:40px;font-family:sans-serif">Ace needs JavaScript enabled. It runs entirely in your browser — no data leaves your machine.</div></noscript>
<div id="app"></div>
<div id="overlays"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';
/* =========================================================================
   DATA:SKILLS — the backbone of the whole app.
   Domains carry the official Digital SAT weights; every skill belongs to one
   domain. Skill ids are used everywhere (questions, lessons, path, mastery).
   Section pacing targets: RW ~71 sec/q, Math ~95 sec/q.
   ========================================================================= */

const SECTIONS = {
  math: { id: 'math', name: 'Math', paceSec: 95, scaleMin: 200, scaleMax: 800 },
  rw:   { id: 'rw',   name: 'Reading & Writing', paceSec: 71, scaleMin: 200, scaleMax: 800 },
};

const DOMAINS = {
  // Math (~35 / 35 / 15 / 15)
  algebra:     { id: 'algebra',     section: 'math', name: 'Algebra',                         weight: 0.35 },
  advmath:     { id: 'advmath',     section: 'math', name: 'Advanced Math',                   weight: 0.35 },
  psda:        { id: 'psda',        section: 'math', name: 'Problem-Solving & Data Analysis', weight: 0.15 },
  geotrig:     { id: 'geotrig',     section: 'math', name: 'Geometry & Trigonometry',         weight: 0.15 },
  // Reading & Writing (~28 / 26 / 26 / 20)
  craft:       { id: 'craft',       section: 'rw',   name: 'Craft & Structure',              weight: 0.28 },
  infoideas:   { id: 'infoideas',   section: 'rw',   name: 'Information & Ideas',             weight: 0.26 },
  conventions: { id: 'conventions', section: 'rw',   name: 'Standard English Conventions',   weight: 0.26 },
  expression:  { id: 'expression',  section: 'rw',   name: 'Expression of Ideas',            weight: 0.20 },
};

/* 33 skills. `blurb` is the one-line concept used in tooltips & lesson intros. */
const SKILLS = [
  // ---- Algebra ----
  { id: 'alg_linear_eq',  domain: 'algebra', name: 'Linear equations',        blurb: 'Solve one-variable linear equations, including those needing distribution and combining like terms.' },
  { id: 'alg_linear_fn',  domain: 'algebra', name: 'Linear functions & slope', blurb: 'Interpret slope and intercepts; write and use slope-intercept and point-slope forms.' },
  { id: 'alg_systems',    domain: 'algebra', name: 'Systems of equations',     blurb: 'Solve linear systems by substitution and elimination; recognize zero/infinite solutions.' },
  { id: 'alg_inequal',    domain: 'algebra', name: 'Linear inequalities',      blurb: 'Solve and graph inequalities and systems of inequalities in context.' },
  { id: 'alg_word',       domain: 'algebra', name: 'Linear modeling',          blurb: 'Translate real-world situations into linear equations and interpret their parts.' },

  // ---- Advanced Math ----
  { id: 'adv_quadratic',  domain: 'advmath', name: 'Quadratic equations',      blurb: 'Solve quadratics by factoring, the quadratic formula, and completing the square.' },
  { id: 'adv_exponents',  domain: 'advmath', name: 'Exponents & radicals',     blurb: 'Apply exponent rules and rewrite radical and rational exponent expressions.' },
  { id: 'adv_exponential',domain: 'advmath', name: 'Exponential functions',    blurb: 'Model growth and decay; connect percent change to exponential form.' },
  { id: 'adv_polynomial', domain: 'advmath', name: 'Polynomials & factoring',  blurb: 'Factor, expand, and use the structure of polynomial expressions.' },
  { id: 'adv_rational',   domain: 'advmath', name: 'Rational & radical eqns',  blurb: 'Solve rational and radical equations and handle extraneous solutions.' },
  { id: 'adv_functions',  domain: 'advmath', name: 'Functions & nonlinear graphs', blurb: 'Use function notation and read features of nonlinear graphs.' },

  // ---- Problem-Solving & Data Analysis ----
  { id: 'psda_ratio',     domain: 'psda', name: 'Ratios, rates & proportions', blurb: 'Set up and solve proportional relationships and unit rates.' },
  { id: 'psda_percent',   domain: 'psda', name: 'Percentages',                 blurb: 'Percent change, percent of, and successive/mixed percent problems.' },
  { id: 'psda_data',      domain: 'psda', name: 'Data interpretation',         blurb: 'Read tables, bar/line graphs, and scatterplots; interpret trend lines.' },
  { id: 'psda_stats',     domain: 'psda', name: 'Statistics & spread',         blurb: 'Mean, median, mode, range, standard deviation, and margin of error.' },
  { id: 'psda_prob',      domain: 'psda', name: 'Probability & two-way tables',blurb: 'Compute simple and conditional probabilities from counts and tables.' },

  // ---- Geometry & Trigonometry ----
  { id: 'geo_angles',     domain: 'geotrig', name: 'Lines, angles & triangles',blurb: 'Angle relationships, similar triangles, and the triangle rules.' },
  { id: 'geo_circles',    domain: 'geotrig', name: 'Circles',                  blurb: 'Circle equations, arcs, sectors, radians, and inscribed angles.' },
  { id: 'geo_volume',     domain: 'geotrig', name: 'Area & volume',           blurb: 'Areas of plane figures and volumes/surface areas of solids.' },
  { id: 'geo_trig',       domain: 'geotrig', name: 'Right-triangle trig',      blurb: 'SOH-CAH-TOA, the Pythagorean theorem, and special right triangles.' },

  // ---- Craft & Structure ----
  { id: 'rw_vocab',       domain: 'craft', name: 'Words in context',           blurb: 'Choose the word that best fits the logic and tone of a passage.' },
  { id: 'rw_purpose',     domain: 'craft', name: 'Text structure & purpose',   blurb: 'Identify the function of a sentence and the author’s rhetorical purpose.' },
  { id: 'rw_connections', domain: 'craft', name: 'Cross-text connections',     blurb: 'Compare how two texts relate — agreement, response, or contrast.' },

  // ---- Information & Ideas ----
  { id: 'rw_main',        domain: 'infoideas', name: 'Central ideas & details',blurb: 'Find the main idea and the details that directly support it.' },
  { id: 'rw_evidence',    domain: 'infoideas', name: 'Command of evidence',    blurb: 'Pick the detail that best supports or weakens a given claim.' },
  { id: 'rw_quant',       domain: 'infoideas', name: 'Quantitative evidence',  blurb: 'Use data from a graph or table to complete or support a claim.' },
  { id: 'rw_inference',   domain: 'infoideas', name: 'Inferences',             blurb: 'Draw the conclusion the passage most logically leads to.' },

  // ---- Standard English Conventions ----
  { id: 'rw_boundaries',  domain: 'conventions', name: 'Boundaries & punctuation', blurb: 'Join and separate clauses correctly — commas, semicolons, colons, dashes.' },
  { id: 'rw_sva',         domain: 'conventions', name: 'Subject-verb agreement',   blurb: 'Match verbs to their true subjects across interrupting phrases.' },
  { id: 'rw_verb',        domain: 'conventions', name: 'Verb tense & form',        blurb: 'Choose consistent, logical tense and correct verb forms.' },
  { id: 'rw_modifiers',   domain: 'conventions', name: 'Pronouns & modifiers',     blurb: 'Fix pronoun agreement/clarity and dangling or misplaced modifiers.' },

  // ---- Expression of Ideas ----
  { id: 'rw_transitions', domain: 'expression', name: 'Transitions',           blurb: 'Select the transition that matches the logical relationship between ideas.' },
  { id: 'rw_synthesis',   domain: 'expression', name: 'Rhetorical synthesis',  blurb: 'Combine notes to meet a specific rhetorical goal efficiently.' },
];

/* Additional authored questions live in the DATA:QUESTIONS_* generated batches
   and push into GEN_BANK, which is merged into the runtime bank alongside the
   hand-written seed arrays. Keeps large batches in tidy, grouped blocks. */
const GEN_BANK = [];
const GEN_LESSONS = [];    // generated Learn lessons push here (loaded before this file's consumers)
const VOCAB_STARTER = [];  // generated starter vocab words push here

/* Fast lookups built once. */
const SKILL_BY_ID = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const skillSection = (id) => DOMAINS[SKILL_BY_ID[id].domain].section;
const skillsInDomain = (dom) => SKILLS.filter(s => s.domain === dom);
const skillsInSection = (sec) => SKILLS.filter(s => DOMAINS[s.domain].section === sec);
const domainsInSection = (sec) => Object.values(DOMAINS).filter(d => d.section === sec);

/* =========================================================================
   DATA:QUESTIONS_MATH
   Authoring schema (one object per question):
     { id, skill, difficulty(1|2|3|"extreme"), type("mcq"|"spr"),
       stem, choices:[4 strings] (mcq only), answer, explanation, strategyTag? }
   `section` and `domain` are auto-derived from `skill` at load (normalizeQuestion),
   so authors set `skill` only and never risk drift.
   mcq `answer` = correct letter "A".."D".  spr `answer` = string; the grader
   accepts equivalent fraction/decimal forms (and an optional `answers` array).
   Every math key below was solved by hand — the worked solution is in `explanation`.
   Grouped by domain for easy editing. Merged into one bank at runtime.
   ========================================================================= */

const QUESTIONS_MATH_ALGEBRA = [
  { id: 'M0001', skill: 'alg_linear_eq', difficulty: 1, type: 'mcq',
    stem: 'If $3(x - 4) = 18$, what is the value of $x$?',
    choices: ['2', '6', '10', '22'], answer: 'C',
    explanation: 'Distribute: $3x - 12 = 18$. Add 12: $3x = 30$. Divide by 3: $x = 10$. (B) 6 just divides 18 by 3 and ignores the −12. (D) 22 adds 12 to 18 without dividing. (A) 2 has no valid path.',
    strategyTag: 'plug_in' },

  { id: 'M0002', skill: 'alg_linear_eq', difficulty: 2, type: 'spr',
    stem: 'If $\\frac{2x+1}{3} = 5$, what is the value of $x$?',
    answer: '7',
    explanation: 'Multiply both sides by 3: $2x + 1 = 15$. Subtract 1: $2x = 14$. Divide by 2: $x = 7$.' },

  { id: 'M0003', skill: 'alg_linear_fn', difficulty: 2, type: 'mcq',
    stem: 'A line passes through $(0, -3)$ and has slope 2. Which equation represents the line?',
    choices: ['$y = 2x - 3$', '$y = -3x + 2$', '$y = 2x + 3$', '$y = -2x - 3$'], answer: 'A',
    explanation: 'Slope-intercept form $y = mx + b$ has $m = 2$ and $y$-intercept $b = -3$, so $y = 2x - 3$. (C) uses the wrong intercept sign, (B) swaps slope and intercept, and (D) uses the wrong slope sign.' },

  { id: 'M0004', skill: 'alg_linear_fn', difficulty: 2, type: 'mcq',
    stem: 'The graph of a linear function $f$ passes through $(2, 5)$ and $(4, 11)$. What is the slope of the graph?',
    choices: ['2', '3', '4', '6'], answer: 'B',
    explanation: 'Slope $= \\frac{11 - 5}{4 - 2} = \\frac{6}{2} = 3$. (D) 6 forgets to divide by the run. (A),(C) mis-subtract the coordinates.' },

  { id: 'M0005', skill: 'alg_systems', difficulty: 2, type: 'mcq',
    stem: 'For the system $y = 2x + 1$ and $y = -x + 7$, what is the value of $x$ at the solution?',
    choices: ['1', '2', '3', '4'], answer: 'B',
    explanation: 'Set the right sides equal: $2x + 1 = -x + 7 \\Rightarrow 3x = 6 \\Rightarrow x = 2$ (and $y = 5$). Plug the other options into both equations and they fail.',
    strategyTag: 'backsolve' },

  { id: 'M0006', skill: 'alg_systems', difficulty: 3, type: 'spr',
    stem: 'If $3x + 2y = 16$ and $x - 2y = 0$, what is the value of $x$?',
    answer: '4',
    explanation: 'Add the equations to eliminate $y$: $(3x + 2y) + (x - 2y) = 16 + 0 \\Rightarrow 4x = 16 \\Rightarrow x = 4$.',
    strategyTag: 'plug_in' },

  { id: 'M0007', skill: 'alg_inequal', difficulty: 2, type: 'mcq',
    stem: 'Which value of $x$ satisfies $-2x + 5 > 1$?',
    choices: ['$x = 4$', '$x = 3$', '$x = 1$', '$x = 2$'], answer: 'C',
    explanation: 'Solve: $-2x + 5 > 1 \\Rightarrow -2x > -4$. Dividing by a negative flips the sign: $x < 2$. Only $x = 1$ is less than 2. $x = 2$ gives exactly 1, which is not greater than 1.' },

  { id: 'M0008', skill: 'alg_word', difficulty: 2, type: 'spr',
    stem: 'A gym charges a \\$30 sign-up fee plus \\$20 per month. After how many months does the total cost reach \\$170?',
    answer: '7',
    explanation: 'Total cost: $30 + 20m = 170$. Subtract 30: $20m = 140$. Divide by 20: $m = 7$ months.' },

  { id: 'M0009', skill: 'alg_word', difficulty: 3, type: 'mcq',
    stem: 'A printer produces pages at a constant rate. It prints 90 pages in 4 minutes. At this rate, how many pages does it print in 10 minutes?',
    choices: ['180', '200', '225', '250'], answer: 'C',
    explanation: 'Rate $= 90 \\div 4 = 22.5$ pages/min. In 10 minutes: $22.5 \\times 10 = 225$. (A) 180 doubles the 4-minute count; (B),(D) misuse the rate.',
    strategyTag: 'plug_in' },
];

const QUESTIONS_MATH_ADVANCED = [
  { id: 'M0101', skill: 'adv_quadratic', difficulty: 2, type: 'mcq',
    stem: 'What are the solutions to $x^2 - 5x + 6 = 0$?',
    choices: ['$x = -2$ and $x = -3$', '$x = 2$ and $x = 3$', '$x = 1$ and $x = 6$', '$x = -1$ and $x = 6$'], answer: 'B',
    explanation: 'Factor: $(x - 2)(x - 3) = 0$, so $x = 2$ or $x = 3$. (A) has flipped signs (those solve $x^2 + 5x + 6$). (C),(D) mis-factor 6 as $1 \\cdot 6$.' },

  { id: 'M0102', skill: 'adv_quadratic', difficulty: 3, type: 'spr',
    stem: 'One solution to $x^2 - 6x + 4 = 0$ can be written as $3 + \\sqrt{k}$. What is the value of $k$?',
    answer: '5',
    explanation: 'Quadratic formula: $x = \\frac{6 \\pm \\sqrt{36 - 16}}{2} = \\frac{6 \\pm \\sqrt{20}}{2} = 3 \\pm \\sqrt{5}$. Matching $3 + \\sqrt{k}$ gives $k = 5$.' },

  { id: 'M0103', skill: 'adv_exponents', difficulty: 2, type: 'mcq',
    stem: 'Which expression is equivalent to $\\dfrac{x^5 \\cdot x^3}{x^2}$ for $x \\neq 0$?',
    choices: ['$x^6$', '$x^7$', '$x^{10}$', '$x^{-4}$'], answer: 'A',
    explanation: 'Add exponents when multiplying, subtract when dividing: $x^{5+3-2} = x^6$. (B) forgets the $-2$, (C) multiplies the exponents, (D) reverses the operations.' },

  { id: 'M0104', skill: 'adv_exponents', difficulty: 3, type: 'mcq',
    stem: 'If $x > 0$, which expression is equivalent to $\\sqrt{50x^4}$?',
    choices: ['$5x^2\\sqrt{2}$', '$25x^2\\sqrt{2}$', '$5x\\sqrt{2}$', '$10x^2$'], answer: 'A',
    explanation: '$\\sqrt{50x^4} = \\sqrt{25 \\cdot 2 \\cdot x^4} = 5x^2\\sqrt{2}$. (B) keeps 25 outside the root, (C) mishandles $x^4$, (D) drops the $\\sqrt{2}$.' },

  { id: 'M0105', skill: 'adv_exponential', difficulty: 3, type: 'mcq',
    stem: 'A culture of 200 bacteria doubles every 3 hours. Which function gives the population after $t$ hours?',
    choices: ['$P = 200(2)^{t/3}$', '$P = 200(2)^{3t}$', '$P = 200 + \\tfrac{2t}{3}$', '$P = 200(3)^{t/2}$'], answer: 'A',
    explanation: 'Doubling means base 2; "every 3 hours" places $t/3$ in the exponent: $P = 200(2)^{t/3}$. (B) triples the rate, (C) is linear, (D) uses the wrong base and exponent.' },

  { id: 'M0106', skill: 'adv_polynomial', difficulty: 2, type: 'mcq',
    stem: 'Which expression is equivalent to $(2x - 3)(x + 5)$?',
    choices: ['$2x^2 + 7x - 15$', '$2x^2 - 15$', '$2x^2 + 10x - 15$', '$2x^2 + 7x + 15$'], answer: 'A',
    explanation: 'FOIL: $2x \\cdot x + 2x \\cdot 5 - 3 \\cdot x - 3 \\cdot 5 = 2x^2 + 10x - 3x - 15 = 2x^2 + 7x - 15$. (C) forgets the $-3x$ term, (B) drops the middle terms, (D) has the wrong constant sign.' },

  { id: 'M0107', skill: 'adv_functions', difficulty: 2, type: 'spr',
    stem: 'If $f(x) = 2x^2 - 3x + 1$, what is the value of $f(3)$?',
    answer: '10',
    explanation: 'Substitute $x = 3$: $f(3) = 2(3)^2 - 3(3) + 1 = 18 - 9 + 1 = 10$.' },

  { id: 'M0108', skill: 'adv_rational', difficulty: 3, type: 'mcq',
    stem: 'If $\\dfrac{x}{x-2} = 3$, what is the value of $x$?',
    choices: ['2', '3', '4', '6'], answer: 'B',
    explanation: 'Multiply both sides by $(x-2)$: $x = 3(x-2) = 3x - 6$. Then $-2x = -6$, so $x = 3$. Check: $\\frac{3}{1} = 3$. ✓ (C) 4 gives $\\frac{4}{2}=2$; (A) 2 makes the denominator 0.' },
];

const QUESTIONS_MATH_PSDA = [
  { id: 'M0201', skill: 'psda_ratio', difficulty: 1, type: 'spr',
    stem: 'If 4 pencils cost \\$1.20, what is the cost, in dollars, of 10 pencils?',
    answer: '3',
    explanation: 'Unit price $= 1.20 \\div 4 = \\$0.30$ per pencil. Then $10 \\times 0.30 = \\$3.00$.' },

  { id: 'M0202', skill: 'psda_percent', difficulty: 2, type: 'mcq',
    stem: 'A jacket priced at \\$80 is discounted by 25%. What is the sale price?',
    choices: ['\\$55', '\\$60', '\\$65', '\\$75'], answer: 'B',
    explanation: 'A 25% discount keeps 75%: $80 \\times 0.75 = \\$60$. Equivalently, 25% of 80 is \\$20 off. (A) subtracts \\$25 instead of 25%; (C),(D) use the wrong percent.' },

  { id: 'M0203', skill: 'psda_percent', difficulty: 3, type: 'mcq',
    stem: 'A population grows from 250 to 320. What is the percent increase, to the nearest percent?',

  { id: 'GCR1-20', skill: 'rw_connections', difficulty: 2, type: 'mcq',

  { id: 'GCR2-11', skill: 'rw_purpose', difficulty: 2, type: 'mcq',

  { id: 'GCR2-14', skill: 'rw_purpose', difficulty: 3, type: 'mcq',
    passage: 'The team’s survey suggests that students who sleep more tend to earn higher grades. The authors are careful, though, to note that their data cannot show which came first: better sleep might improve grades, but it is equally possible that less-stressed, higher-achieving students simply find it easier to sleep. Settling the question would require tracking the same students for several years.',

  { id: 'GCR2-15', skill: 'rw_purpose', difficulty: 3, type: 'mcq',

  { id: 'GCR2-16', skill: 'rw_purpose', difficulty: 3, type: 'mcq',

  { id: 'GCR2-17', skill: 'rw_connections', difficulty: 1, type: 'mcq',

  { id: 'GCR2-18', skill: 'rw_connections', difficulty: 2, type: 'mcq',

  { id: 'GCR2-19', skill: 'rw_connections', difficulty: 2, type: 'mcq',

   Everything is plain functions over a single persisted state object `S`.

/* ---------- tiny utilities ---------- */

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const sum = (arr) => arr.reduce((a, b) => a + b, 0);

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function shuffle(arr) {              // Fisher-Yates (non-mutating)
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];

}
function sample(arr, n) { return shuffle(arr).slice(0, n); }

/* date helpers use local day boundaries */
const DAY = 86400000;

function weekKey(ts = Date.now()) {  // ISO-ish week bucket
  const d = new Date(ts); const onejan = new Date(d.getFullYear(), 0, 1);
  const wk = Math.ceil(((d - onejan) / DAY + onejan.getDay() + 1) / 7);

/* =========================================================================
   Persistence — namespaced, versioned localStorage.
   ========================================================================= */
const LS = {
  state: 'ace.v1.state',

const STATE_VERSION = 1;

function defaultState() {

    weekly: { week: weekKey(now), xp: 0, goal: 600, history: [] },
    hearts: { count: 5, max: 5 }, // optional hearts mode (path practice)
    mastery: {},              // skillId -> 0..100
    seen: {},                 // qid -> count (exposure)
    stats: { answered: 0, correct: 0, bySkill: {}, secByQ: [] },
    mistakes: {},             // qid -> {qid, chosen, ts, stage, dueTs, streak}
    badges: {},               // badgeId -> ts

    quest: { day: null, items: [] },
    seenTutorial: false,
  };
}

let S = defaultState();

function migrate(st) {
  if (!st || typeof st !== 'object') return defaultState();
  if (st.version !== STATE_VERSION) {
    // Shallow-merge unknown/older shapes onto defaults so new keys appear.
    const base = defaultState();
    const merged = Object.assign(base, st);
    merged.settings = Object.assign(base.settings, st.settings || {});
    merged.version = STATE_VERSION;
    return merged;
  }
  // Ensure any newly-added top-level keys exist even on same version.
  const base = defaultState();
  for (const k of Object.keys(base)) if (!(k in st)) st[k] = base[k];
  st.settings = Object.assign(base.settings, st.settings || {});
  return st;
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS.state);
    if (raw) S = migrate(JSON.parse(raw));
    else S = defaultState();
  } catch (e) { console.warn('State load failed, starting fresh:', e); S = defaultState(); }
  return S;
}

let _saveTimer = null;
function save(now = false) {
  S.lastActive = Date.now();
  const write = () => { try { localStorage.setItem(LS.state, JSON.stringify(S)); } catch (e) { console.error('Save failed', e); toast('Storage full — some progress may not persist', 'coral'); } };
  if (now) { clearTimeout(_saveTimer); write(); }
  else { clearTimeout(_saveTimer); _saveTimer = setTimeout(write, 400); }
}
function resetAll() { localStorage.removeItem(LS.state); S = defaultState(); save(true); }

/* =========================================================================
   Question bank — normalize authored questions, add AI + imported ones.
   ========================================================================= */
function normalizeQuestion(q) {
  const skill = SKILL_BY_ID[q.skill];
  const domain = skill ? DOMAINS[skill.domain] : null;
  return Object.assign({}, q, {
    domain: skill ? skill.domain : (q.domain || 'algebra'),
    section: domain ? domain.section : (q.section || 'math'),
    difficulty: q.difficulty === 'extreme' ? 'extreme' : Number(q.difficulty) || 1,
  });
}

let BANK = [];
let BANK_BY_ID = {};
function buildBank() {
  const authored = [].concat(
    typeof QUESTIONS_MATH !== 'undefined' ? QUESTIONS_MATH : [],
    typeof QUESTIONS_RW !== 'undefined' ? QUESTIONS_RW : [],
    typeof GEN_BANK !== 'undefined' ? GEN_BANK : [],
    (S.ai && S.ai.questions) ? S.ai.questions : []
  );
  BANK = []; BANK_BY_ID = {};
  for (const raw of authored) {
    if (!raw || !raw.id || BANK_BY_ID[raw.id]) continue;   // skip dupes by id
    const q = normalizeQuestion(raw);
    BANK.push(q); BANK_BY_ID[q.id] = q;
  }
}
const getQ = (id) => BANK_BY_ID[id];

/* difficulty helpers */
const diffNum = (d) => (d === 'extreme' ? 4 : d);
const isExtreme = (q) => q.difficulty === 'extreme';

/* Filtered selection. opts: {section, domain, skill, difficulty, excludeSeen, limit, extreme} */
function pickQuestions(opts = {}) {
  let pool = BANK.filter((q) => {
    if (opts.extreme) { if (!isExtreme(q)) return false; }
    else if (isExtreme(q) && !opts.includeExtreme) return false;
    if (opts.section && q.section !== opts.section) return false;
    if (opts.domain && q.domain !== opts.domain) return false;
    if (opts.skill && q.skill !== opts.skill) return false;
    if (opts.difficulty && q.difficulty !== opts.difficulty) return false;
    if (opts.difficultyMax && diffNum(q.difficulty) > opts.difficultyMax) return false;
    return true;
  });
  if (opts.excludeSeen) {
    const fresh = pool.filter((q) => !S.seen[q.id]);
    if (fresh.length >= (opts.limit || 1)) pool = fresh;   // only exclude if enough remain
  }
  if (opts.excludeIds) pool = pool.filter((q) => !opts.excludeIds.includes(q.id));
  pool = shuffle(pool);
  if (opts.sortByDifficulty) pool.sort((a, b) => diffNum(a.difficulty) - diffNum(b.difficulty));
  return opts.limit ? pool.slice(0, opts.limit) : pool;
}
function bankStats() {
  const s = { total: BANK.length, math: 0, rw: 0, extreme: 0, bySkill: {}, byDiff: { 1: 0, 2: 0, 3: 0, extreme: 0 } };
  for (const q of BANK) {
    if (isExtreme(q)) s.extreme++; else s[q.section]++;
    s.byDiff[q.difficulty] = (s.byDiff[q.difficulty] || 0) + 1;
    s.bySkill[q.skill] = (s.bySkill[q.skill] || 0) + 1;
  }
  return s;
}

/* =========================================================================
   Math rendering — KaTeX when available, readable plain-text fallback offline.
   Content uses $...$ (inline) and $$...$$ (display).
   ========================================================================= */
function katexReady() { return typeof window.katex !== 'undefined' && window.katex && !window.__KATEX_JS_FAILED; }

function texFallback(tex) {
  // Make raw TeX readable when KaTeX is unavailable.
  let t = tex;
  t = t.replace(/\\d?frac\s*{([^{}]*)}\s*{([^{}]*)}/g, '($1)/($2)');
  t = t.replace(/\\sqrt\s*{([^{}]*)}/g, '√($1)');
  t = t.replace(/\\times/g, '×').replace(/\\cdot/g, '·').replace(/\\div/g, '÷');
  t = t.replace(/\\pm/g, '±').replace(/\\leq/g, '≤').replace(/\\geq/g, '≥').replace(/\\neq/g, '≠');
  t = t.replace(/\\pi/g, 'π').replace(/\\theta/g, 'θ').replace(/\\Rightarrow/g, '⇒').replace(/\\approx/g, '≈');
  t = t.replace(/\\left|\\right/g, '');
  t = t.replace(/\^{([^{}]*)}/g, (m, p) => toSup(p)).replace(/\^(\w)/g, (m, p) => toSup(p));
  t = t.replace(/_{([^{}]*)}/g, (m, p) => toSub(p)).replace(/_(\w)/g, (m, p) => toSub(p));
  t = t.replace(/[{}]/g, '').replace(/\\,/g, ' ').replace(/\\ /g, ' ');
  return t;
}
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '-': '⁻', 'n': 'ⁿ', 'x': 'ˣ', 'a': 'ᵃ', 'b': 'ᵇ', 'c': 'ᶜ', 't': 'ᵗ' };
const SUB = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉', 'n': 'ₙ', 'x': 'ₓ' };
const toSup = (s) => s.split('').map((c) => SUP[c] || c).join('');
const toSub = (s) => s.split('').map((c) => SUB[c] || c).join('');

// Convert a string with $...$ segments into safe HTML.
// A backslash-escaped \$ is a literal dollar sign (money) and never a delimiter.
const _DOLLAR = String.fromCharCode(1);
function mathToHtml(text) {
  if (text == null) return '';
  const s = String(text).replace(/\\\$/g, _DOLLAR);
  const parts = s.split(/(\$\$[^$]*\$\$|\$[^$]*\$)/g);
  return parts.map((p) => {
    if (/^\$\$[^$]*\$\$$/.test(p)) return mathSpan(p.slice(2, -2), true);
    if (/^\$[^$]*\$$/.test(p)) return mathSpan(p.slice(1, -1), false);
    return esc(p).split(_DOLLAR).join('$').replace(/\n/g, '<br>');
  }).join('');
}
function mathSpan(tex, display) {
  return `<span class="math" data-tex="${esc(tex)}" data-display="${display ? 1 : 0}">` +
    `<span class="math-fallback">${esc(texFallback(tex))}</span></span>`;
}
// After inserting HTML, typeset any .math spans with KaTeX (if ready).
function typeset(root = document) {
  if (!katexReady()) return;
  $$('.math', root).forEach((span) => {
    if (span.dataset.done) return;
    const tex = span.dataset.tex;
    try {
      span.innerHTML = window.katex.renderToString(tex, { throwOnError: false, displayMode: span.dataset.display === '1' });
      span.dataset.done = '1';
    } catch (e) { /* keep fallback */ }
  });
}
// Re-typeset once KaTeX finishes loading (deferred script).
window.addEventListener('load', () => { setTimeout(() => typeset(document), 60); });

/* =========================================================================
   SmartScore mastery (IXL-style, 0..100).
   - correct raises more for harder Qs, diminishing near the top;
   - the 90..100 Challenge Zone only opens to difficulty-3 / extreme questions;
   - misses drop more when your score is high (an easy miss stings).
   ========================================================================= */
const CHALLENGE_ZONE = 90;
function getMastery(skillId) { return S.mastery[skillId] ?? 0; }

function applyMastery(skillId, correct, difficulty) {
  const m = getMastery(skillId);
  const hard = difficulty === 3 || difficulty === 'extreme';
  let next = m;
  if (correct) {
    const base = { 1: 6, 2: 9, 3: 13, extreme: 16 }[difficulty] || 8;
    const gain = base * (0.35 + 0.65 * (1 - m / 100));     // diminishing near top
    next = m + gain;
    if (!hard) next = Math.min(next, Math.max(m, CHALLENGE_ZONE)); // easy Qs can't climb the zone
    next = Math.min(100, next);
  } else {
    const penaltyBase = m >= CHALLENGE_ZONE ? 12 : m >= 70 ? 9 : m >= 40 ? 6 : 4;
    const soften = hard ? 0.65 : 1;                        // missing a hard Q hurts a bit less
    next = Math.max(0, m - penaltyBase * soften);
  }
  S.mastery[skillId] = Math.round(next * 10) / 10;
  return { from: m, to: S.mastery[skillId] };
}
function masteryTier(m) {           // -> {cls, label}
  if (m >= 90) return { cls: 'm5', label: 'Mastered' };
  if (m >= 80) return { cls: 'm4', label: 'Strong' };
  if (m >= 60) return { cls: 'm3', label: 'Proficient' };
  if (m >= 40) return { cls: 'm2', label: 'Developing' };
  if (m >= 20) return { cls: 'm1', label: 'Beginning' };
  return { cls: 'm0', label: 'Not started' };
}
function sectionMastery(sec) {
  const skills = skillsInSection(sec);
  // weight each skill by its domain weight (so heavy domains matter more)
  let wsum = 0, msum = 0;
  for (const sk of skills) {
    const w = DOMAINS[sk.domain].weight;
    wsum += w; msum += w * getMastery(sk.id);
  }
  return wsum ? msum / wsum : 0;
}
function weakestSkills(n = 3, sec = null) {
  let list = SKILLS.slice();
  if (sec) list = list.filter((s) => skillSection(s.id) === sec);
  // prioritize skills that have been touched but are low, then untouched
  return list
    .map((s) => ({ s, m: getMastery(s.id), seen: (S.stats.bySkill[s.id]?.n || 0) }))
    .sort((a, b) => (a.m - b.m) || (b.seen - a.seen))
    .slice(0, n).map((x) => x.s);
}

/* =========================================================================
   Scoring model — raw -> scaled (200..800) via anchor tables approximating
   released Digital SAT curves; easier Module 2 imposes a lower ceiling.
   Clearly an ESTIMATE; every UI surface labels it so.
   ========================================================================= */
const SCORE_ANCHORS = {
  // percent-correct -> scaled score (per section). Interpolated linearly.
  rw:   [[0, 200], [10, 230], [20, 290], [30, 360], [40, 430], [50, 500], [60, 560], [70, 620], [80, 680], [90, 740], [97, 780], [100, 800]],
  math: [[0, 200], [10, 240], [20, 310], [30, 390], [40, 460], [50, 530], [60, 590], [70, 650], [80, 710], [90, 760], [97, 785], [100, 800]],
};
const EASY_MODULE_CEIL = 630;  // routing to the easier Module 2 caps the section (approx.)
const ROUTE_HARD_THRESHOLD = 0.65; // module-1 accuracy to unlock the harder Module 2

function interp(anchors, x) {
  if (x <= anchors[0][0]) return anchors[0][1];
  const last = anchors[anchors.length - 1];
  if (x >= last[0]) return last[1];
  for (let i = 1; i < anchors.length; i++) {
    if (x <= anchors[i][0]) {
      const [x0, y0] = anchors[i - 1], [x1, y1] = anchors[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
  }
  return last[1];
}
// estimateScaledScore: section 'rw'|'math', fraction correct 0..1, easyModule bool
function estimateScaledScore(section, fractionCorrect, easyModule = false) {
  const raw = interp(SCORE_ANCHORS[section], clamp(fractionCorrect, 0, 1) * 100);
  let scaled = Math.round(raw / 10) * 10;
  if (easyModule) scaled = Math.min(scaled, EASY_MODULE_CEIL);
  return clamp(scaled, 200, 800);
}
// Projected total from mastery, blended toward recent mocks/diagnostics.
function projectedScore() {
  const fromMastery = (sec) => {
    const m = sectionMastery(sec) / 100;
    const acc = clamp(0.32 + 0.63 * m, 0, 0.99);   // mastery -> expected accuracy
    return estimateScaledScore(sec, acc, false);
  };
  let rw = fromMastery('rw'), math = fromMastery('math');
  // blend with recent measured results (weighted toward most recent)
  const recent = S.scoreHistory.slice(-4);
  if (recent.length) {
    let wsum = 0, rwS = 0, mS = 0;
    recent.forEach((h, i) => { const w = i + 1; wsum += w; rwS += w * h.rw; mS += w * h.math; });
    const mRw = rwS / wsum, mMath = mS / wsum;
    rw = Math.round(0.45 * rw + 0.55 * mRw);
    math = Math.round(0.45 * math + 0.55 * mMath);
  }
  rw = clamp(Math.round(rw / 10) * 10, 200, 800);
  math = clamp(Math.round(math / 10) * 10, 200, 800);
  return { rw, math, total: rw + math };
}

/* =========================================================================
   XP, levels, combo, streak.
   ========================================================================= */
const XP_BASE = { 1: 10, 2: 15, 3: 25, extreme: 50 };
function comboMultiplier() { return Math.min(2, 1 + Math.min(S.combo, 10) * 0.1); }
function xpForAnswer(difficulty) { return Math.round((XP_BASE[difficulty] || 10) * comboMultiplier()); }

const LEVEL_TITLES = [
  [1, 'Rookie'], [3, 'Apprentice'], [5, 'Scholar'], [8, 'Sharpshooter'],
  [11, 'Strategist'], [15, 'Analyst'], [19, 'Tactician'], [24, 'Virtuoso'],
  [30, 'Ace Cadet'], [37, 'Ace'], [45, 'Grandmaster'], [55, 'Perfectionist'],
];
function xpToReach(level) { return Math.round(80 * (level - 1) + 20 * (level - 1) * (level - 1)); } // cumulative
function levelInfo(xp = S.xp) {
  let level = 1;
  while (xpToReach(level + 1) <= xp) level++;
  const curMin = xpToReach(level), nextMin = xpToReach(level + 1);
  let title = LEVEL_TITLES[0][1];
  for (const [lvl, t] of LEVEL_TITLES) if (level >= lvl) title = t;
  return { level, title, curMin, nextMin, into: xp - curMin, span: nextMin - curMin, pct: (xp - curMin) / (nextMin - curMin) };
}
function addXP(n) {
  const before = levelInfo().level;
  S.xp += n;
  S.weekly.xp += n;
  const after = levelInfo();
  if (after.level > before) toast(`Level ${after.level} — ${after.title}!`, 'gold', 4000);
  return after;
}

function rolloverWeekIfNeeded() {
  const wk = weekKey();
  if (S.weekly.week !== wk) {
    S.weekly.history.push({ week: S.weekly.week, xp: S.weekly.xp, goal: S.weekly.goal });
    if (S.weekly.history.length > 20) S.weekly.history = S.weekly.history.slice(-20);
    S.weekly.week = wk; S.weekly.xp = 0;
  }
  if (S.streak.freezeWeek !== wk) {   // grant the weekly earnable freeze
    S.streak.freezeWeek = wk;
    S.streak.freezes = Math.min(2, (S.streak.freezes || 0) + 1);
  }
}
// Record daily activity; maintains the streak (auto-uses a freeze for a single gap).
function touchStreak() {
  const today = dayKey();
  const st = S.streak;
  if (st.lastDay === today) return st.count;
  if (st.lastDay == null) { st.count = 1; }
  else {
    const gap = daysBetween(st.lastDay, today);
    if (gap === 1) st.count += 1;
    else if (gap === 2 && st.freezes > 0) { st.freezes -= 1; st.count += 1; toast('Streak-freeze used — streak saved ❄️', 'sky'); }
    else st.count = 1;
  }
  st.lastDay = today;
  if (st.count > 0 && st.count % 7 === 0) award('streak7');
  save();
  return st.count;
}

/* =========================================================================
   Mistake bank — auto-capture, spaced retry (2 then 5 days), leave after
   2 consecutive correct retries.
   ========================================================================= */
const MISTAKE_STEPS = [2, 5];  // days
function recordMistake(q, chosen) {
  const ex = S.mistakes[q.id];
  const now = Date.now();
  if (ex) { ex.chosen = chosen; ex.ts = now; ex.streak = 0; ex.stage = Math.min(ex.stage, MISTAKE_STEPS.length - 1); ex.dueTs = now + MISTAKE_STEPS[ex.stage] * DAY; }
  else S.mistakes[q.id] = { qid: q.id, chosen, ts: now, stage: 0, streak: 0, dueTs: now + MISTAKE_STEPS[0] * DAY };
}
function resolveMistakeAttempt(qid, correct) {
  const m = S.mistakes[qid]; if (!m) return;
  if (correct) {
    m.streak += 1;
    if (m.streak >= 2) { delete S.mistakes[qid]; toast('Cleared from mistake bank ✓', 'mint'); return; }
    m.stage = Math.min(m.stage + 1, MISTAKE_STEPS.length - 1);
    m.dueTs = Date.now() + MISTAKE_STEPS[m.stage] * DAY;
  } else { m.streak = 0; m.stage = 0; m.dueTs = Date.now() + MISTAKE_STEPS[0] * DAY; }
}
function dueMistakes() {
  const now = Date.now();
  return Object.values(S.mistakes).filter((m) => m.dueTs <= now && getQ(m.qid)).map((m) => getQ(m.qid));
}
function allMistakes() { return Object.values(S.mistakes).filter((m) => getQ(m.qid)); }

/* =========================================================================
   SPR grading — accept equivalent fraction/decimal forms.
   ========================================================================= */
function parseNumeric(str) {
  if (str == null) return null;
  let s = String(str).trim().replace(/\s+/g, '');
  if (s === '') return null;
  if (/^[-+]?\d*\.?\d+$/.test(s)) return parseFloat(s);
  const frac = s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
  if (frac) { const d = parseFloat(frac[2]); return d === 0 ? null : parseFloat(frac[1]) / d; }
  return null;
}
function gradeSPR(userStr, q) {
  const answers = [].concat(q.answer, q.answers || []);
  const un = parseNumeric(userStr);
  for (const a of answers) {
    const an = parseNumeric(a);
    if (un != null && an != null && Math.abs(un - an) < 1e-6) return true;
    if (String(userStr).trim() === String(a).trim()) return true;
  }
  return false;
}
function gradeQuestion(q, response) {
  if (q.type === 'spr') return gradeSPR(response, q);
  return response === q.answer; // mcq: response is a letter
}
const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

/* =========================================================================
   Central answer recorder — the one place a graded answer updates all state.
   meta: { sec (seconds taken), fromMistake, fromMock, silent (no xp/combo) }
   ========================================================================= */
function recordAnswer(q, response, meta = {}) {
  const correct = gradeQuestion(q, response);
  // exposure
  S.seen[q.id] = (S.seen[q.id] || 0) + 1;
  // stats
  S.stats.answered++; if (correct) S.stats.correct++;
  const bs = S.stats.bySkill[q.skill] || (S.stats.bySkill[q.skill] = { n: 0, c: 0 });
  bs.n++; if (correct) bs.c++;
  bumpToday('answered', 1); if (correct) bumpToday('correct', 1);
  if (q.section === 'math') bumpToday('math', 1); else if (q.section === 'rw') bumpToday('rw', 1);
  if (typeof meta.sec === 'number') { S.stats.secByQ.push({ s: q.section, sec: meta.sec }); if (S.stats.secByQ.length > 400) S.stats.secByQ = S.stats.secByQ.slice(-400); }
  // mastery
  const mv = applyMastery(q.skill, correct, q.difficulty);
  // combo + xp (skip for silent/mock scoring which is handled separately)
  let xpGain = 0;
  if (!meta.silent) {
    if (correct) { S.combo++; xpGain = xpForAnswer(q.difficulty); addXP(xpGain); }
    else S.combo = 0;
  }
  // mistake bank
  if (!correct) recordMistake(q, response);
  else if (S.mistakes[q.id]) resolveMistakeAttempt(q.id, true);
  if (meta.fromMistake) {
    resolveMistakeAttempt(q.id, correct);
    // clearing a mistake in review earns back a heart (hearts mode)
    if (correct && S.settings.heartsMode && S.hearts.count < S.hearts.max) { S.hearts.count++; }
  }
  // counters + badges
  if (correct && isExtreme(q)) { S.counters.extremeSolved++; award('extreme1'); }
  checkAnswerBadges(q, correct);
  touchStreak();
  save();
  return { correct, xpGain, mastery: mv, combo: S.combo };
}

/* =========================================================================
   ENGINE (extra) — daily activity, study planner + daily quest, Sable
   briefing generator, and the AI client + assistant tools. Split out to keep
   the core engine readable. (Vocab SRS and mock assembly live in their own
   UI/engine sections but persist through the same state `S`.)
   ========================================================================= */

/* ---------- per-day activity counters (drive quests & briefing) ---------- */
function ensureToday() {
  const d = dayKey();
  if (!S.today || S.today.day !== d) {
    // archive yesterday's snapshot for the briefing before resetting
    if (S.today && S.today.day) S.yesterday = S.today;
    S.today = { day: d, answered: 0, correct: 0, math: 0, rw: 0, lessons: 0, vocab: 0, nodes: 0, mocks: 0, xpStart: S.xp };
  }
}
function bumpToday(field, n = 1) { ensureToday(); S.today[field] = (S.today[field] || 0) + n; }
function todayXP() { ensureToday(); return S.xp - (S.today.xpStart || S.xp); }

/* =========================================================================
   Study planner — a rolling weekly plan (or day-by-day countdown when a test
   date is set). Produces the daily quest. Regenerated weekly, or when empty.
   ========================================================================= */
function daysUntilTest() {
  if (!S.settings.testDate) return null;
  const d = daysBetween(dayKey(), S.settings.testDate);
  return d;
}
function generatePlan(force = false) {
  const wk = weekKey();
  if (!force && S.plan && S.plan.week === wk) return S.plan;
  const weak = weakestSkills(6);
  const countdown = daysUntilTest();
  const tasks = [];
  const push = (t) => tasks.push(Object.assign({ id: uid('t'), done: false }, t));

  // Core recurring tasks
  push({ type: 'lesson', label: `Study a lesson: ${SKILL_BY_ID[weak[0].id].name}`, skill: weak[0].id, route: 'learn', params: { skill: weak[0].id } });
  push({ type: 'drill', label: `Drill your weakest skill: ${SKILL_BY_ID[weak[0].id].name}`, skill: weak[0].id, route: 'drills', params: { skill: weak[0].id }, goal: 8 });
  push({ type: 'drill', label: `Drill: ${SKILL_BY_ID[weak[1].id].name}`, skill: weak[1].id, route: 'drills', params: { skill: weak[1].id }, goal: 8 });
  push({ type: 'vocab', label: 'Clear your vocabulary review queue', route: 'vocab', goal: 15 });
  if (allMistakes().length) push({ type: 'mistakes', label: 'Review your mistake bank', route: 'mistakes' });

  // Weekly rhythm: a mock roughly weekly (or more often near a test date)
  const mocksDone = S.counters.mocksDone || 0;
  const wantMock = countdown != null ? countdown <= 21 : (mocksDone < 3 || (Date.now() % 7 === 0));
  if (wantMock) push({ type: 'mock', label: 'Take a full adaptive mock exam', route: 'mocks' });

  S.plan = { week: wk, ts: Date.now(), tasks, countdown };
  save();
  return S.plan;
}

/* The daily quest = a slice of the plan for today, plus streak-safety hint.
   Completion is derived live from today's activity counters. */
function getDailyQuest() {
  ensureToday();
  const plan = generatePlan();
  const day = dayKey();
  if (!S.quest || S.quest.day !== day) {
    // pick up to 4 tasks for today, rotating by day
    const items = plan.tasks.slice(0, 4).map((t) => ({ ...t, done: false }));
    S.quest = { day, items };
    save();
  }
  // derive completion from live activity
  for (const it of S.quest.items) {
    if (it.type === 'drill' || it.type === 'mistakes') it.done = it.done || (S.today.answered >= (it.goal || 8));
    if (it.type === 'lesson') it.done = it.done || (S.today.lessons >= 1);
    if (it.type === 'vocab') it.done = it.done || (S.today.vocab >= (it.goal || 15));
    if (it.type === 'mock') it.done = it.done || (S.today.mocks >= 1);
  }
  return S.quest;
}
function questComplete() { const q = getDailyQuest(); return q.items.length > 0 && q.items.every((i) => i.done); }
function markPlanTaskDone(type) {
  // called when a matching activity happens; the derived logic mostly handles it
  const q = getDailyQuest();
  const it = q.items.find((i) => i.type === type && !i.done);
  if (it) { it.done = true; save(); }
}

/* =========================================================================
   Sable briefing — template-generated from local data (works with no key).
   Phase 5 optionally rewrites this in Sable's voice via the API.
   ========================================================================= */
function briefingFacts() {
  ensureToday();
  const proj = projectedScore();
  const streak = S.streak.count;
  const yd = S.yesterday;
  const weak = weakestSkills(3).map((s) => s.name);
  const dut = daysUntilTest();
  return { proj, streak, yesterday: yd, weak, daysUntilTest: dut, quest: getDailyQuest(), due: dueMistakes().length };
}
function templateBriefing() {
  const f = briefingFacts();
  const name = S.settings.assistantName;
  const parts = [];
  // greeting
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  parts.push(`${greet}. ${f.proj.total >= 1500 ? 'You are knocking on the door of a perfect score.' : `Projected total sits at about ${f.proj.total} (${f.proj.rw} RW · ${f.proj.math} Math) — an estimate, of course.`}`);
  // yesterday
  if (f.yesterday && f.yesterday.answered) {
    const acc = f.yesterday.answered ? Math.round(f.yesterday.correct / f.yesterday.answered * 100) : 0;
    parts.push(`Yesterday you answered ${f.yesterday.answered} question${f.yesterday.answered === 1 ? '' : 's'} at ${acc}% accuracy.`);
  }
  // streak
  parts.push(f.streak > 0 ? `Your streak stands at ${f.streak} day${f.streak === 1 ? '' : 's'}${questComplete() ? ' and today is already secured' : '; finish today\'s quest to keep it'}.` : `No streak yet — a single completed quest starts one.`);
  // plan / focus
  parts.push(`Today I\'d focus on ${f.weak.slice(0, 2).join(' and ')}${f.due ? `, and you have ${f.due} question${f.due === 1 ? '' : 's'} due in the mistake bank` : ''}.`);
  // countdown
  if (f.daysUntilTest != null) parts.push(f.daysUntilTest >= 0 ? `${f.daysUntilTest} day${f.daysUntilTest === 1 ? '' : 's'} until test day. We have a plan.` : `Test day has passed — set a new date when you\'re ready.`);
  return parts.join(' ');
}

/* =========================================================================
   AI client — Anthropic Messages API, called directly from the browser.
   Small, well-commented. Everything degrades gracefully with no key.
   Assistant tools + tutor actions are wired in the assistant UI module; this
   is the low-level transport plus a helper for tool-use loops.
   ========================================================================= */
const AI_ENDPOINT = 'https://api.anthropic.com/v1/messages';
function aiConfigured() { return !!(S.settings.apiKey && S.settings.apiKey.trim()); }

async function aiCall({ system, messages, tools, max_tokens = 1024, temperature = 0.7 }) {
  if (!aiConfigured()) throw new Error('No API key set.');
  const body = { model: S.settings.model || 'claude-opus-4-8', max_tokens, messages };
  if (system) body.system = system;
  if (tools) body.tools = tools;
  if (temperature != null) body.temperature = temperature;
  const res = await fetch(AI_ENDPOINT, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': S.settings.apiKey.trim(),
      'anthropic-version': '2023-06-01',
      // Required to call the API directly from a browser (local personal use).
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let msg = `API error ${res.status}`;
    try { const j = await res.json(); msg = j.error?.message || msg; } catch (e) { }
    throw new Error(msg);
  }
  return res.json();
}
// Convenience: single-turn text completion.
async function aiText(system, userText, opts = {}) {
  const data = await aiCall({ system, messages: [{ role: 'user', content: userText }], ...opts });
  return (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n').trim();
}

/* ---------- route parsing (#/route?k=v&...) ---------- */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const params = {};
  if (query) for (const kv of query.split('&')) { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); }
  return { route: path || 'home', params };
}
function navigate(route, params) {
  let h = '#/' + route;
  if (params && Object.keys(params).length) h += '?' + Object.entries(params).map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
  if (location.hash === h) router(); else location.hash = h;
}

/* ---------- app shell ---------- */
function renderShell() {
  const app = document.getElementById('app');
  const nav = NAV.map((n) => `<div class="nav-item" data-route="${n.route}"><span class="ico">${n.icon}</span><span>${n.label}</span></div>`).join('');
  app.innerHTML = `

        ${nav}
        <div class="nav-sep"></div>

        <div class="nav-foot">Digital SAT trainer · runs offline<br>Everything stays on this device.</div>
      </aside>
      <main class="main"><div id="view"></div></main>
    </div>`;
  app.querySelectorAll('.nav-item').forEach((el) => el.addEventListener('click', () => {
    navigate(el.dataset.route);
    document.getElementById('sidebar').classList.remove('open');
  }));
  const mb = document.getElementById('menuBtn');
  if (mb) mb.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  ensureOrb();
}
function setActiveNav(route) {
  $$('.nav-item').forEach((el) => el.classList.toggle('active', el.dataset.route === route));
}

/* ---------- router ---------- */
let _shellBuilt = false;
function router() {
  const { route, params } = parseHash();
  if (!_shellBuilt) { renderShell(); _shellBuilt = true; }
  else if (!document.querySelector('.shell')) { renderShell(); }  // rebuild after a takeover
  const host = document.getElementById('view');
  const def = VIEWS[route] || VIEWS['_missing'];
  setActiveNav(route);
  try {
    host.innerHTML = def.render ? def.render(params) : '';
    typeset(host);
    if (def.mount) def.mount(host, params);
    window.scrollTo(0, 0);
    host.focus?.();
  } catch (e) {
    console.error('View error:', e);
    host.innerHTML = `<div class="card"><h3>Something went wrong rendering this screen.</h3><p class="muted">${esc(e.message)}</p></div>`;
  }
}
